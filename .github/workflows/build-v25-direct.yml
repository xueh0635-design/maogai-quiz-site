name: Build V25 Direct Static

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v25-direct.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build direct V25 HTML with isolated patch scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re,subprocess
          root=Path('diesel-engine-3d-sim')
          enc=''.join((root/'payloads/v19'/f'seg-{i:02d}.txt').read_text().strip() for i in range(7))
          t=gzip.decompress(base64.b64decode(enc)).decode('utf-8')
          patches=[(root/x).read_text() for x in ['v20-patch-a.js','v20-patch-b.js','v21-patch.js','v22-patch.js','v23-patch.js']]
          t=t.replace('V19','V25').replace('v19','v25')
          marker="registerExplode(airFilter,[-220,0,100]);"
          assert marker in t, 'patch marker missing'
          patch_block='\nconst __v25Patch={};\n{\n'+'\n'.join(patches)+"\n__v25Patch.updateRefEngine=updateRefEngine;\n__v25Patch.updateV21=updateV21;\n__v25Patch.updateV22=updateV22;\n__v25Patch.updateV23=updateV23;\n__v25Patch.frontCover=(typeof frontCover!=='undefined'?frontCover:null);\n__v25Patch.sectionFrame=(typeof sectionFrame!=='undefined'?sectionFrame:null);\n}\n"
          t=t.replace(marker,marker+patch_block,1)
          t=t.replace('updateMechanics(dt);fanGroup.rotation.x+=','updateMechanics(dt);__v25Patch.updateRefEngine(dt);__v25Patch.updateV21(dt);__v25Patch.updateV22(dt);__v25Patch.updateV23(dt);fanGroup.rotation.x+=',1)
          t=t.replace("camera.position.set(455,360,620);controls.target.set(0,275,0);camera.fov=34","camera.position.set(805,385,1040);controls.target.set(0,300,5);camera.fov=30",1)
          old="function updateCutaway(){block.material=cutaway?materials.translucent:materials.cast;head.material=cutaway?materials.headGlass:materials.cast;rockerCover.material=cutaway?materials.translucent:materials.castDark;systems.cooling.children.forEach(o=>{if(o.userData.jacket)o.visible=cutaway&&systemVisible('cooling')});$('#cutaway').classList.toggle('active',cutaway)}"
          new="function updateCutaway(){block.material=cutaway?materials.translucent:materials.cast;head.material=cutaway?materials.headGlass:materials.cast;rockerCover.material=cutaway?materials.translucent:materials.castDark;systems.cooling.children.forEach(o=>{if(o.userData.jacket)o.visible=cutaway&&systemVisible('cooling')});if(__v25Patch.frontCover)__v25Patch.frontCover.visible=!cutaway;if(__v25Patch.sectionFrame)__v25Patch.sectionFrame.visible=cutaway;$('#cutaway').classList.toggle('active',cutaway)}"
          if old in t: t=t.replace(old,new,1)
          runtime='\n<script src="../vendor/three-r128.min.js?v=128"></script>\n<script src="../vendor/OrbitControls-r128.js?v=128"></script>\n'
          t=t.replace('</head>',runtime+'</head>',1)
          pattern=r"\(function loadEngineLibraries\(\)\{.*?\n\}\)\(\);"
          boot='\n'.join([
            '(function bootLocalRuntime(){',
            " const loading=document.getElementById('loading'), detail=document.getElementById('loadingDetail'), fallback=document.getElementById('fallback');",
            ' try{',
            "   detail.textContent='本地 Three.js r128 已载入，正在初始化 WebGL…';",
            "   if(!window.THREE) throw new Error('THREE global missing');",
            "   if(!THREE.OrbitControls) throw new Error('OrbitControls missing');",
            '   window.__startDieselEngine();',
            "   loading.style.display='none';",
            ' }catch(err){',
            "   console.error('V25 direct boot failed',err);",
            "   loading.style.display='none';",
            "   fallback.style.display='flex';",
            "   const p=fallback.querySelector('p'); if(p)p.textContent='V25 本地运行库已加载，但 WebGL 初始化失败：'+(err&&err.message?err.message:String(err));",
            ' }',
            '})();'
          ])
          t,n=re.subn(pattern,boot,t,flags=re.S)
          assert n==1, f'loader replacement count={n}'
          t=t.replace('正在尝试可用的 Three.js 镜像源…','正在读取本地 Three.js r128…')
          t=t.replace('3D 引擎镜像源均不可用。请确认浏览器可访问互联网后刷新；页面会自动在 cdnjs、jsDelivr、unpkg 之间回退，不会无限停在构建状态。','本地 3D 运行库或 WebGL 初始化失败。')
          t=t.replace('REFERENCE VISUAL · CUTAWAY CAD PASS','DIGITAL TWIN · DIRECT STATIC')
          t=t.replace('REFERENCE VISUAL · CAD-LIKE CUTAWAY','DIGITAL TWIN · V25 DIRECT')
          t=t.replace('REFERENCE VISUAL · ADAPTIVE 60FPS','DIGITAL TWIN · V25')
          forbidden=['cdnjs.cloudflare.com','cdn.jsdelivr.net','unpkg.com/three','loadEngineLibraries','tryUrls(','createObjectURL','DecompressionStream']
          for x in forbidden: assert x not in t, f'forbidden runtime dependency remains: {x}'
          assert '../vendor/three-r128.min.js' in t
          assert '../vendor/OrbitControls-r128.js' in t
          assert '__v25Patch.updateRefEngine' in t
          out=root/'versions/v25-direct.html'
          out.write_text(t,encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',t,re.S|re.I)
          assert scripts, 'no inline script found'
          for i,s in enumerate(scripts):
              f=Path(f'/tmp/v25-inline-{i}.js'); f.write_text(s)
              subprocess.run(['node','--check',str(f)],check=True)
          subprocess.run(['node','--check',str(root/'vendor/three-r128.min.js')],check=True)
          subprocess.run(['node','--check',str(root/'vendor/OrbitControls-r128.js')],check=True)
          report=root/'logs/v25-direct-build.txt'
          report.write_text('\n'.join(['BUILD=V25_DIRECT_STATIC_SCOPE_ISOLATED',f'HTML_BYTES={len(t.encode())}','CLIENT_PAYLOAD_FETCH=NO','CLIENT_GZIP_DECOMPRESS=NO','BLOB_IFRAME=NO','THIRD_PARTY_CDN=NO','LOCAL_THREE=../vendor/three-r128.min.js','LOCAL_ORBIT=../vendor/OrbitControls-r128.js','DYNAMIC_MIRROR_LOADER=NO','PATCH_SCOPE=ISOLATED_BLOCK','NODE_SYNTAX=PASS'])+'\n',encoding='utf-8')
          PY
      - name: Install Chromium test driver
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Launch local server
        run: |
          python3 -m http.server 8000 >/tmp/v25-http.log 2>&1 &
          echo $! >/tmp/v25-http.pid
          sleep 1
      - name: Validate mobile Chromium boot
        shell: bash
        run: |
          cat > ./v25-test.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'fs';
          const candidates=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const exe=candidates.find(p=>fs.existsSync(p));
          if(!exe) throw new Error('No system Chrome found: '+candidates.join(','));
          const browser=await puppeteer.launch({executablePath:exe,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});
          const page=await browser.newPage();
          await page.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
          const errors=[]; const logs=[];
          page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
          page.on('console',m=>{logs.push(m.type().toUpperCase()+' '+m.text()); if(m.type()==='error')errors.push('CONSOLE '+m.text())});
          const resp=await page.goto('http://127.0.0.1:8000/diesel-engine-3d-sim/versions/v25-direct.html?ci=1',{waitUntil:'networkidle0',timeout:30000});
          if(!resp||!resp.ok())throw new Error('HTTP '+(resp&&resp.status()));
          await new Promise(r=>setTimeout(r,5000));
          const state=await page.evaluate(()=>{const loading=document.getElementById('loading'),fallback=document.getElementById('fallback'),canvas=document.getElementById('canvas3d');let gl=null;try{gl=canvas&&(canvas.getContext('webgl2')||canvas.getContext('webgl')||canvas.getContext('experimental-webgl'))}catch(e){}return{three:!!window.THREE,revision:window.THREE&&THREE.REVISION,orbit:!!(window.THREE&&THREE.OrbitControls),loading:loading&&getComputedStyle(loading).display,fallback:fallback&&getComputedStyle(fallback).display,canvasW:canvas&&canvas.width,canvasH:canvas&&canvas.height,webgl:!!gl,badge:document.body.innerText.includes('DIRECT STATIC')}});
          console.log('STATE',JSON.stringify(state));
          console.log('LOGS',logs.slice(-40).join('\n'));
          await page.screenshot({path:'/tmp/v25-mobile.png',fullPage:false});
          await browser.close();
          if(errors.length)throw new Error(errors.join('\n'));
          if(!state.three||state.revision!=='128'||!state.orbit)throw new Error('runtime globals failed '+JSON.stringify(state));
          if(state.loading!=='none'||state.fallback!=='none')throw new Error('boot overlay failed '+JSON.stringify(state));
          if(!state.webgl||!state.canvasW||!state.canvasH)throw new Error('WebGL canvas failed '+JSON.stringify(state));
          console.log('MOBILE_CHROMIUM_BOOT=PASS');
          JS
          node ./v25-test.mjs
          rm -f ./v25-test.mjs
          printf 'MOBILE_CHROMIUM_BOOT=PASS\n' >> diesel-engine-3d-sim/logs/v25-direct-build.txt
      - name: Commit only validated direct build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diesel-engine-3d-sim/versions/v25-direct.html diesel-engine-3d-sim/logs/v25-direct-build.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build validated V25 direct static runtime'
          git push
