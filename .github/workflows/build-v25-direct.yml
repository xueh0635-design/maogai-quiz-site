name: Build V25 Direct Static

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v25-direct.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build direct V25 HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          root=Path('diesel-engine-3d-sim')
          enc=''.join((root/'payloads/v19'/f'seg-{i:02d}.txt').read_text().strip() for i in range(7))
          t=gzip.decompress(base64.b64decode(enc)).decode('utf-8')
          pa=(root/'v20-patch-a.js').read_text()
          pb=(root/'v20-patch-b.js').read_text()
          pc=(root/'v21-patch.js').read_text()
          pd=(root/'v22-patch.js').read_text()
          pe=(root/'v23-patch.js').read_text()
          t=t.replace('V19','V25').replace('v19','v25')
          marker="registerExplode(airFilter,[-220,0,100]);"
          assert marker in t, 'patch marker missing'
          t=t.replace(marker,marker+'\n'+pa+'\n'+pb+'\n'+pc+'\n'+pd+'\n'+pe,1)
          t=t.replace('updateMechanics(dt);fanGroup.rotation.x+=','updateMechanics(dt);updateRefEngine(dt);updateV21(dt);updateV22(dt);updateV23(dt);fanGroup.rotation.x+=',1)
          t=t.replace("camera.position.set(455,360,620);controls.target.set(0,275,0);camera.fov=34","camera.position.set(805,385,1040);controls.target.set(0,300,5);camera.fov=30",1)
          old="function updateCutaway(){block.material=cutaway?materials.translucent:materials.cast;head.material=cutaway?materials.headGlass:materials.cast;rockerCover.material=cutaway?materials.translucent:materials.castDark;systems.cooling.children.forEach(o=>{if(o.userData.jacket)o.visible=cutaway&&systemVisible('cooling')});$('#cutaway').classList.toggle('active',cutaway)}"
          new="function updateCutaway(){block.material=cutaway?materials.translucent:materials.cast;head.material=cutaway?materials.headGlass:materials.headGlass;rockerCover.material=cutaway?materials.translucent:materials.castDark;systems.cooling.children.forEach(o=>{if(o.userData.jacket)o.visible=cutaway&&systemVisible('cooling')});if(typeof frontCover!=='undefined')frontCover.visible=!cutaway;if(typeof sectionFrame!=='undefined')sectionFrame.visible=cutaway;$('#cutaway').classList.toggle('active',cutaway)}"
          if old in t: t=t.replace(old,new,1)
          runtime='\n<script src="../vendor/three-r128.min.js?v=128"></script>\n<script src="../vendor/OrbitControls-r128.js?v=128"></script>\n'
          t=t.replace('</head>',runtime+'</head>',1)
          pattern=r"\(function loadEngineLibraries\(\)\{.*?\n\}\)\(\);"
          boot='\n'.join([
            '(function bootLocalRuntime(){',
            " const loading=document.getElementById('loading'), detail=document.getElementById('loadingDetail'), fallback=document.getElementById('fallback');",
            ' try{',
            "   detail.textContent='本地 Three.js r128 已载入，正在初始化 WebGL…';",
            "   if(!window.THREE) throw new Error('THREE global missing');",
            "   if(!THREE.OrbitControls) throw new Error('OrbitControls missing');",
            '   window.__startDieselEngine();',
            "   loading.style.display='none';",
            ' }catch(err){',
            "   console.error('V25 direct boot failed',err);",
            "   loading.style.display='none';",
            "   fallback.style.display='flex';",
            "   const p=fallback.querySelector('p'); if(p)p.textContent='V25 本地运行库已加载，但 WebGL 初始化失败：'+(err&&err.message?err.message:String(err));",
            ' }',
            '})();'
          ])
          t,n=re.subn(pattern,boot,t,flags=re.S)
          assert n==1, f'loader replacement count={n}'
          t=t.replace('正在尝试可用的 Three.js 镜像源…','正在读取本地 Three.js r128…')
          t=t.replace('3D 引擎镜像源均不可用。请确认浏览器可访问互联网后刷新；页面会自动在 cdnjs、jsDelivr、unpkg 之间回退，不会无限停在构建状态。','本地 3D 运行库或 WebGL 初始化失败。')
          t=t.replace('REFERENCE VISUAL · CUTAWAY CAD PASS','DIGITAL TWIN · DIRECT STATIC')
          t=t.replace('REFERENCE VISUAL · CAD-LIKE CUTAWAY','DIGITAL TWIN · V25 DIRECT')
          t=t.replace('REFERENCE VISUAL · ADAPTIVE 60FPS','DIGITAL TWIN · V25')
          forbidden=['cdnjs.cloudflare.com','cdn.jsdelivr.net','unpkg.com/three','loadEngineLibraries','tryUrls(','createObjectURL','DecompressionStream']
          for x in forbidden: assert x not in t, f'forbidden runtime dependency remains: {x}'
          assert '../vendor/three-r128.min.js' in t
          assert '../vendor/OrbitControls-r128.js' in t
          assert 'window.__startDieselEngine();' in t
          out=root/'versions/v25-direct.html'
          out.write_text(t,encoding='utf-8')
          report=root/'logs/v25-direct-build.txt'
          report.write_text('\n'.join(['BUILD=V25_DIRECT_STATIC',f'HTML_BYTES={len(t.encode())}','CLIENT_PAYLOAD_FETCH=NO','CLIENT_GZIP_DECOMPRESS=NO','BLOB_IFRAME=NO','THIRD_PARTY_CDN=NO','LOCAL_THREE=../vendor/three-r128.min.js','LOCAL_ORBIT=../vendor/OrbitControls-r128.js','DYNAMIC_MIRROR_LOADER=NO','ASSERTIONS=PASS'])+'\n',encoding='utf-8')
          PY
      - name: Commit direct build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diesel-engine-3d-sim/versions/v25-direct.html diesel-engine-3d-sim/logs/v25-direct-build.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build V25 direct static runtime'
          git push
