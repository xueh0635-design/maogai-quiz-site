name: Upgrade V29 Material Cohesion

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upgrade-v29-material-cohesion.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unify V26-V28 materials and section treatment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('diesel-engine-3d-sim')
          oldkey='v29pbr2'; newkey='v29mat2'

          # Force nested wrappers to load this exact cross-layer material pass.
          for rel in ['versions/v26-direct.html','versions/v27-direct.html','versions/v28-direct.html','versions/v29-direct.html']:
              p=root/rel; t=p.read_text(encoding='utf-8'); t=t.replace(oldkey,newkey); p.write_text(t,encoding='utf-8')

          p=root/'versions/v26-direct.html'; t=p.read_text(encoding='utf-8')
          old="const M={steel:new T.MeshPhysicalMaterial({color:0xd9dfe2,roughness:.12,metalness:1,clearcoat:.34,clearcoatRoughness:.1}),dark:new T.MeshPhysicalMaterial({color:0x2b3033,roughness:.42,metalness:.82}),alloy:new T.MeshPhysicalMaterial({color:0xb9c2c6,roughness:.24,metalness:.92,clearcoat:.2}),brass:new T.MeshPhysicalMaterial({color:0xb0813e,roughness:.22,metalness:.94}),iron:new T.MeshPhysicalMaterial({color:0x4b3e35,roughness:.47,metalness:.79}),red:new T.MeshPhysicalMaterial({color:0x963c32,roughness:.35,metalness:.48,clearcoat:.18}),rubber:new T.MeshStandardMaterial({color:0x050607,roughness:.95,metalness:.01})};"
          new="const M={steel:new T.MeshPhysicalMaterial({color:0xd4dade,roughness:.11,metalness:1,clearcoat:.34,clearcoatRoughness:.10,envMapIntensity:1.58}),dark:new T.MeshPhysicalMaterial({color:0x1b2125,roughness:.50,metalness:.70,envMapIntensity:.72}),alloy:new T.MeshPhysicalMaterial({color:0x98a3a8,roughness:.30,metalness:.84,clearcoat:.16,clearcoatRoughness:.28,envMapIntensity:1.06}),brass:new T.MeshPhysicalMaterial({color:0xc08a3d,roughness:.20,metalness:.96,envMapIntensity:1.34}),iron:new T.MeshPhysicalMaterial({color:0x3d3531,roughness:.52,metalness:.68,envMapIntensity:.74}),red:new T.MeshPhysicalMaterial({color:0x7d2924,roughness:.46,metalness:.32,clearcoat:.08,envMapIntensity:.56}),rubber:new T.MeshStandardMaterial({color:0x040607,roughness:.96,metalness:.01,envMapIntensity:.08})};"
          assert old in t; t=t.replace(old,new,1); p.write_text(t,encoding='utf-8')

          p=root/'versions/v27-direct.html'; t=p.read_text(encoding='utf-8')
          old="const M={steel:new T.MeshPhysicalMaterial({color:0xdce2e5,roughness:.1,metalness:1,clearcoat:.36,clearcoatRoughness:.08}),dark:new T.MeshPhysicalMaterial({color:0x292e32,roughness:.4,metalness:.86}),alloy:new T.MeshPhysicalMaterial({color:0xbfc8cc,roughness:.22,metalness:.93,clearcoat:.22}),brass:new T.MeshPhysicalMaterial({color:0xb3823f,roughness:.2,metalness:.95}),iron:new T.MeshPhysicalMaterial({color:0x4a3b33,roughness:.5,metalness:.78}),red:new T.MeshPhysicalMaterial({color:0x963c33,roughness:.34,metalness:.5,clearcoat:.18}),rubber:new T.MeshStandardMaterial({color:0x050607,roughness:.95,metalness:.01}),section:new T.MeshBasicMaterial({color:0xff3b30,transparent:true,opacity:.92,depthTest:false})};"
          new="const M={steel:new T.MeshPhysicalMaterial({color:0xd4dade,roughness:.10,metalness:1,clearcoat:.36,clearcoatRoughness:.08,envMapIntensity:1.60}),dark:new T.MeshPhysicalMaterial({color:0x1a2024,roughness:.50,metalness:.70,envMapIntensity:.72}),alloy:new T.MeshPhysicalMaterial({color:0x96a1a7,roughness:.30,metalness:.84,clearcoat:.16,clearcoatRoughness:.28,envMapIntensity:1.06}),brass:new T.MeshPhysicalMaterial({color:0xc08a3d,roughness:.20,metalness:.96,envMapIntensity:1.34}),iron:new T.MeshPhysicalMaterial({color:0x3b3430,roughness:.54,metalness:.66,envMapIntensity:.72}),red:new T.MeshPhysicalMaterial({color:0x7d2924,roughness:.46,metalness:.32,clearcoat:.08,envMapIntensity:.56}),rubber:new T.MeshStandardMaterial({color:0x040607,roughness:.96,metalness:.01,envMapIntensity:.08}),section:new T.MeshPhysicalMaterial({color:0x8e1813,roughness:.50,metalness:.24,clearcoat:.06,transparent:true,opacity:.82,depthTest:false,envMapIntensity:.45})};"
          assert old in t; t=t.replace(old,new,1)
          oldliner="if(o.name==='Cylinder Liner'){const mm=o.material.clone();mm.transparent=true;mm.opacity=.10;mm.depthWrite=false;mm.roughness=.18;mm.metalness=.18;o.material=mm}"
          newliner="if(o.name==='Cylinder Liner'){const mm=o.material.clone();mm.color.setHex(0x59666e);mm.transparent=true;mm.opacity=.20;mm.depthWrite=false;mm.roughness=.30;mm.metalness=.62;mm.envMapIntensity=.62;o.material=mm}"
          assert oldliner in t; t=t.replace(oldliner,newliner,1); p.write_text(t,encoding='utf-8')

          p=root/'versions/v28-direct.html'; t=p.read_text(encoding='utf-8')
          old="const M={cast:new T.MeshPhysicalMaterial({color:0x555d62,roughness:.43,metalness:.78,clearcoat:.08}),dark:new T.MeshPhysicalMaterial({color:0x24292d,roughness:.44,metalness:.84}),steel:new T.MeshPhysicalMaterial({color:0xdde3e6,roughness:.09,metalness:1,clearcoat:.38,clearcoatRoughness:.08}),alloy:new T.MeshPhysicalMaterial({color:0xbfc7ca,roughness:.22,metalness:.92,clearcoat:.2}),brass:new T.MeshPhysicalMaterial({color:0xb38442,roughness:.2,metalness:.95}),bronze:new T.MeshPhysicalMaterial({color:0x9b6f39,roughness:.27,metalness:.9}),section:new T.MeshBasicMaterial({color:0xff392e,transparent:true,opacity:.96,depthTest:false})};"
          new="const M={cast:new T.MeshPhysicalMaterial({color:0x505b61,roughness:.48,metalness:.64,clearcoat:.06,clearcoatRoughness:.52,envMapIntensity:.80}),dark:new T.MeshPhysicalMaterial({color:0x171d21,roughness:.56,metalness:.62,envMapIntensity:.62}),steel:new T.MeshPhysicalMaterial({color:0xdde3e6,roughness:.085,metalness:1,clearcoat:.38,clearcoatRoughness:.08,envMapIntensity:1.70}),alloy:new T.MeshPhysicalMaterial({color:0x939ea4,roughness:.31,metalness:.82,clearcoat:.15,clearcoatRoughness:.29,envMapIntensity:1.04}),brass:new T.MeshPhysicalMaterial({color:0xc08a3d,roughness:.20,metalness:.96,envMapIntensity:1.34}),bronze:new T.MeshPhysicalMaterial({color:0x9f7036,roughness:.29,metalness:.86,envMapIntensity:1.02}),section:new T.MeshPhysicalMaterial({color:0x941710,roughness:.48,metalness:.28,clearcoat:.07,transparent:true,opacity:.88,depthTest:false,envMapIntensity:.48})};"
          assert old in t; t=t.replace(old,new,1)
          oldline="details.traverse(o=>{if(!o.isMesh)return;if(['Cylinder Deck','Cylinder Head','Oil Sump','Cam Carrier','Crankcase Front Cover','Crankcase Rear Wall'].includes(o.name))o.visible=false;if(o.name==='Cylinder Liner'){o.material.transparent=true;o.material.opacity=.075;o.material.depthWrite=false}});"
          newline="details.traverse(o=>{if(!o.isMesh)return;if(['Cylinder Deck','Cylinder Head','Oil Sump','Cam Carrier','Crankcase Front Cover','Crankcase Rear Wall'].includes(o.name))o.visible=false;if(o.name==='Cylinder Liner'){o.material.color.setHex(0x56636b);o.material.transparent=true;o.material.opacity=.18;o.material.depthWrite=false;o.material.roughness=.30;o.material.metalness=.62;o.material.envMapIntensity=.60}});for(const o of details.children){if(o.isLineSegments)o.visible=false}"
          assert oldline in t; t=t.replace(oldline,newline,1)
          marker="const shell=new T.Group();shell.name='V28 True Half Shell';scene.add(shell);"
          repl=marker+"w.__v28MaterialDebug={cohesivePBR:true,staleOutlineVisible:details.children.filter(o=>o.isLineSegments&&o.visible).length,sectionMaterial:'physical'};"
          assert marker in t; t=t.replace(marker,repl,1); p.write_text(t,encoding='utf-8')

          # Refresh default route cache key without changing version semantics.
          ip=root/'index.html'; idx=ip.read_text(encoding='utf-8'); idx=idx.replace('cb=v29pbr2','cb='+newkey); ip.write_text(idx,encoding='utf-8')
          PY

      - name: Install Chromium
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Serve
        run: |
          python3 -m http.server 8000 >/tmp/v29-mat-http.log 2>&1 &
          sleep 1

      - name: Validate untouched V29 material cohesion and interactions
        shell: bash
        run: |
          cat > test.mjs <<'JS'
          import puppeteer from 'puppeteer-core';import fs from 'fs';
          const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);if(!exe)throw new Error('No Chrome');
          const browser=await puppeteer.launch({executablePath:exe,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});
          const page=await browser.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.stack||e.message));await page.setViewport({width:1536,height:960,deviceScaleFactor:1});
          await page.goto('http://127.0.0.1:8000/diesel-engine-3d-sim/versions/v29-direct.html?qa=material-cohesion',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForFunction(()=>{let f=document.getElementById('stage'),w=f&&f.contentWindow,d=f&&f.contentDocument;for(let i=0;i<8&&d;i++){const n=d.getElementById('stage');if(!n)break;f=n;w=f.contentWindow;d=f.contentDocument}return !!(w?.__v29Debug?.studioPBR&&w?.__v28MaterialDebug?.cohesivePBR)}, {timeout:90000,polling:500});await new Promise(r=>setTimeout(r,1400));
          const s=await page.evaluate(()=>{let f=document.getElementById('stage'),w=f.contentWindow,d=f.contentDocument;for(let i=0;i<8&&d;i++){const n=d.getElementById('stage');if(!n)break;f=n;w=f.contentWindow;d=f.contentDocument}return{v25:w.__v25VisualDebug,v28:w.__v28MaterialDebug,v29:w.__v29Debug,explode:d.getElementById('explodeAmount').value,explodeActive:d.getElementById('explode').classList.contains('active'),cutaway:d.getElementById('cutaway').classList.contains('active'),fallback:getComputedStyle(d.getElementById('fallback')).display}});
          console.log('STATE',JSON.stringify(s));if(errors.length)throw new Error(errors.slice(0,4).join('\n'));if(s.fallback!=='none'||s.explode!=='0'||s.explodeActive||!s.cutaway)throw new Error('initial state regression');if(!s.v25.environment||s.v28.staleOutlineVisible!==0||!s.v29.studioPBR)throw new Error('material cohesion missing '+JSON.stringify(s));
          await page.screenshot({path:'/tmp/v29-material-cohesion.png'});
          const ex=await page.evaluate(()=>{let f=document.getElementById('stage'),w=f.contentWindow,d=f.contentDocument;for(let i=0;i<8&&d;i++){const n=d.getElementById('stage');if(!n)break;f=n;w=f.contentWindow;d=f.contentDocument}const b=d.getElementById('explode');b.click();for(let i=0;i<80;i++)w.__v25PatchDebug.updateV23(.05);return{v:d.getElementById('explodeAmount').value,a:b.classList.contains('active'),p:w.__v25PatchDebug.refDetails.position.toArray()}});if(ex.v!=='72'||!ex.a||Math.hypot(...ex.p)<80)throw new Error('explode regression '+JSON.stringify(ex));
          const cut=await page.evaluate(()=>{let f=document.getElementById('stage'),w=f.contentWindow,d=f.contentDocument;for(let i=0;i<8&&d;i++){const n=d.getElementById('stage');if(!n)break;f=n;w=f.contentWindow;d=f.contentDocument}const b=d.getElementById('cutaway');b.click();w.__v25PatchDebug.updateV21(.016);const off=[b.classList.contains('active'),w.__v25PatchDebug.frontCover.visible,w.__v25PatchDebug.sectionFrame.visible];b.click();w.__v25PatchDebug.updateV21(.016);const on=[b.classList.contains('active'),w.__v25PatchDebug.frontCover.visible,w.__v25PatchDebug.sectionFrame.visible];return{off,on}});if(cut.off[0]||cut.off[1]!==true||cut.off[2]!==false||!cut.on[0]||cut.on[1]!==false||cut.on[2]!==true)throw new Error('cutaway regression '+JSON.stringify(cut));
          const mobile=await browser.newPage(),me=[];mobile.on('pageerror',e=>me.push(e.stack||e.message));await mobile.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});await mobile.goto('http://127.0.0.1:8000/diesel-engine-3d-sim/versions/v29-direct.html?qa=mobile-material',{waitUntil:'domcontentloaded',timeout:30000});await mobile.waitForFunction(()=>{let f=document.getElementById('stage'),w=f&&f.contentWindow,d=f&&f.contentDocument;for(let i=0;i<8&&d;i++){const n=d.getElementById('stage');if(!n)break;f=n;w=f.contentWindow;d=f.contentDocument}return !!w?.__v28MaterialDebug?.cohesivePBR},{timeout:90000,polling:600});if(me.length)throw new Error(me.slice(0,4).join('\n'));await browser.close();console.log('ALL=PASS');
          JS
          node test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: v29-material-cohesion-preview
          path: /tmp/v29-material-cohesion.png
          retention-days: 7

      - name: Commit only validated material pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diesel-engine-3d-sim/index.html diesel-engine-3d-sim/versions/v26-direct.html diesel-engine-3d-sim/versions/v27-direct.html diesel-engine-3d-sim/versions/v28-direct.html diesel-engine-3d-sim/versions/v29-direct.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'unify V26-V29 PBR materials and section treatment'
          git push
