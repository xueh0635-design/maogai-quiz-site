name: Build V25 Studio PBR

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v25-studio-pbr.yml'
      - 'diesel-engine-3d-sim/v25-visual-patch.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build V25 Studio PBR HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re,subprocess
          root=Path('diesel-engine-3d-sim')
          enc=''.join((root/'payloads/v19'/f'seg-{i:02d}.txt').read_text().strip() for i in range(7))
          t=gzip.decompress(base64.b64decode(enc)).decode('utf-8')
          patch_names=['v20-patch-a.js','v20-patch-b.js','v21-patch.js','v22-patch.js','v23-patch.js','v25-visual-patch.js']
          patches=[(root/x).read_text() for x in patch_names]
          t=t.replace('V19','V25').replace('v19','v25')
          marker="registerExplode(airFilter,[-220,0,100]);"
          assert marker in t, 'patch marker missing'
          patch_block='\nconst __v25Patch={};\n{\n'+'\n'.join(patches)+"\n__v25Patch.updateRefEngine=updateRefEngine;\n__v25Patch.updateV21=updateV21;\n__v25Patch.updateV22=updateV22;\n__v25Patch.updateV23=updateV23;\n__v25Patch.frontCover=(typeof frontCover!=='undefined'?frontCover:null);\n__v25Patch.sectionFrame=(typeof sectionFrame!=='undefined'?sectionFrame:null);\n__v25Patch.refRoot=(typeof refRoot!=='undefined'?refRoot:null);\n__v25Patch.refDetails=(typeof refDetails!=='undefined'?refDetails:null);\n__v25Patch.refMotion=(typeof refMotion!=='undefined'?refMotion:null);\n__v25Patch.refValve=(typeof refValve!=='undefined'?refValve:null);\n__v25Patch.refFuel=(typeof refFuel!=='undefined'?refFuel:null);\n__v25Patch.refGas=(typeof refGas!=='undefined'?refGas:null);\n__v25Patch.refCrank=(typeof refCrank!=='undefined'?refCrank:null);\nwindow.__v25PatchDebug=__v25Patch;\n}\n"
          t=t.replace(marker,marker+patch_block,1)

          anim_pat=r"updateMechanics\(dt\);updateCallouts\(\);fanGroup\.rotation\.x\+="
          anim_new="updateMechanics(dt);__v25Patch.updateRefEngine(dt);__v25Patch.updateV21(dt);__v25Patch.updateV22(dt);__v25Patch.updateV23(dt);updateCallouts();fanGroup.rotation.x+="
          t,n_anim=re.subn(anim_pat,anim_new,t,count=1)
          assert n_anim==1, f'animate patch wiring replacement count={n_anim}'

          old_dt="requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;"
          new_dt="requestAnimationFrame(animate);const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;"
          assert old_dt in t, 'animate dt signature changed; refusing silent build'
          t=t.replace(old_dt,new_dt,1)

          t=t.replace("camera.position.set(455,360,620);controls.target.set(0,275,0);camera.fov=34","camera.position.set(805,385,1040);controls.target.set(0,300,5);camera.fov=30",1)

          old="function updateCutaway(){block.material=cutaway?materials.translucent:materials.cast;head.material=cutaway?materials.headGlass:materials.cast;rockerCover.material=cutaway?materials.translucent:materials.castDark;cutEdges.forEach(e=>e.visible=cutaway);systems.cooling.children.forEach(o=>{if(o.userData.jacket)o.visible=cutaway&&systemVisible('cooling')});$('#cutaway').classList.toggle('active',cutaway)}"
          new="function updateCutaway(){block.material=cutaway?materials.translucent:materials.cast;head.material=cutaway?materials.headGlass:materials.cast;rockerCover.material=cutaway?materials.translucent:materials.castDark;cutEdges.forEach(e=>e.visible=cutaway);systems.cooling.children.forEach(o=>{if(o.userData.jacket)o.visible=cutaway&&systemVisible('cooling')});if(__v25Patch.frontCover)__v25Patch.frontCover.visible=!cutaway;if(__v25Patch.sectionFrame)__v25Patch.sectionFrame.visible=cutaway;$('#cutaway').classList.toggle('active',cutaway)}"
          assert old in t, 'cutaway source signature changed; refusing silent build'
          t=t.replace(old,new,1)

          runtime='\n<script src="../vendor/three-r128.min.js?v=128"></script>\n<script src="../vendor/OrbitControls-r128.js?v=128"></script>\n'
          t=t.replace('</head>',runtime+'</head>',1)
          pattern=r"\(function loadEngineLibraries\(\)\{.*?\n\}\)\(\);"
          boot='\n'.join([
            '(function bootLocalRuntime(){',
            " const loading=document.getElementById('loading'), detail=document.getElementById('loadingDetail'), fallback=document.getElementById('fallback');",
            ' try{',
            "   detail.textContent='本地 Three.js r128 已载入，正在初始化 Studio PBR…';",
            "   if(!window.THREE) throw new Error('THREE global missing');",
            "   if(!THREE.OrbitControls) throw new Error('OrbitControls missing');",
            '   window.__startDieselEngine();',
            "   loading.style.display='none';",
            ' }catch(err){',
            "   console.error('V25 Studio PBR boot failed',err);",
            "   loading.style.display='none';",
            "   fallback.style.display='flex';",
            "   const p=fallback.querySelector('p'); if(p)p.textContent='V25 Studio PBR 初始化失败：'+(err&&err.message?err.message:String(err));",
            ' }',
            '})();'
          ])
          t,n=re.subn(pattern,boot,t,flags=re.S)
          assert n==1, f'loader replacement count={n}'
          t=t.replace('正在尝试可用的 Three.js 镜像源…','正在读取本地 Three.js r128…')
          t=t.replace('REFERENCE VISUAL · CUTAWAY CAD PASS','STUDIO PBR · ENV REFLECTIONS')
          t=t.replace('REFERENCE VISUAL · CAD-LIKE CUTAWAY','STUDIO PBR · METAL MATERIALS')
          t=t.replace('REFERENCE VISUAL · ADAPTIVE 60FPS','STUDIO PBR · V25')

          forbidden=['cdnjs.cloudflare.com','cdn.jsdelivr.net','unpkg.com/three','loadEngineLibraries','tryUrls(','createObjectURL','DecompressionStream']
          for x in forbidden: assert x not in t, f'forbidden runtime dependency remains: {x}'
          assert '../vendor/three-r128.min.js' in t
          assert '../vendor/OrbitControls-r128.js' in t
          assert '__v25Patch.updateRefEngine(dt);__v25Patch.updateV21(dt);__v25Patch.updateV22(dt);__v25Patch.updateV23(dt);' in t
          assert 'Math.max(0,Math.min(.05,(now-last)/1000))' in t
          assert 'if(__v25Patch.frontCover)__v25Patch.frontCover.visible=!cutaway' in t
          assert 'window.__v25VisualDebug' in t
          assert 'scene.environment=studioEnv' in t
          assert "STUDIO PBR · ENV REFLECTIONS" in t

          out=root/'versions/v25-direct.html'
          out.write_text(t,encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',t,re.S|re.I)
          assert scripts, 'no inline script found'
          for i,s in enumerate(scripts):
              f=Path(f'/tmp/v25-pbr-inline-{i}.js');f.write_text(s);subprocess.run(['node','--check',str(f)],check=True)
          subprocess.run(['node','--check',str(root/'v25-visual-patch.js')],check=True)
          subprocess.run(['node','--check',str(root/'vendor/three-r128.min.js')],check=True)
          subprocess.run(['node','--check',str(root/'vendor/OrbitControls-r128.js')],check=True)
          report=root/'logs/v25-direct-build.txt'
          report.write_text('\n'.join([
            'BUILD=V25_STUDIO_PBR','HTML_BYTES='+str(len(t.encode())),
            'CLIENT_PAYLOAD_FETCH=NO','CLIENT_GZIP_DECOMPRESS=NO','THIRD_PARTY_CDN=NO',
            'PATCH_ANIMATE_WIRING=PASS','SAFE_FRAME_DT=PASS','CUTAWAY_WIRING=PASS','NODE_SYNTAX=PASS',
            'PROCEDURAL_ENVIRONMENT=PASS','PHYSICAL_MATERIAL_TUNING=PASS','CONTACT_SHADOW=PASS','COLD_WARM_LIGHT_RIG=PASS'
          ])+'\n',encoding='utf-8')
          PY

      - name: Install Chromium test driver
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Launch local server
        run: |
          python3 -m http.server 8000 >/tmp/v25-pbr-http.log 2>&1 &
          echo $! >/tmp/v25-pbr-http.pid
          sleep 1

      - name: Validate boot interactions and PBR state
        shell: bash
        run: |
          cat > ./v25-pbr-test.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'fs';
          const candidates=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const exe=candidates.find(p=>fs.existsSync(p));
          if(!exe)throw new Error('No system Chrome found');
          const browser=await puppeteer.launch({executablePath:exe,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});

          const page=await browser.newPage();
          await page.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
          const errors=[];const bad=[];
          page.on('pageerror',e=>errors.push(e.stack||e.message));
          page.on('response',r=>{if(r.status()>=400&&!r.url().endsWith('/favicon.ico'))bad.push(r.status()+' '+r.url())});
          const resp=await page.goto('http://127.0.0.1:8000/diesel-engine-3d-sim/versions/v25-direct.html?ci=studio-pbr',{waitUntil:'networkidle0',timeout:30000});
          if(!resp||!resp.ok())throw new Error('HTTP '+(resp&&resp.status()));
          await new Promise(r=>setTimeout(r,1800));
          const state=await page.evaluate(()=>({
            loading:getComputedStyle(document.getElementById('loading')).display,
            fallback:getComputedStyle(document.getElementById('fallback')).display,
            three:!!window.THREE,orbit:!!(window.THREE&&THREE.OrbitControls),
            patch:!!window.__v25PatchDebug,visual:window.__v25VisualDebug||null,
            canvas:[document.getElementById('canvas3d').width,document.getElementById('canvas3d').height]
          }));
          console.log('BOOT',JSON.stringify(state));
          if(errors.length)throw new Error('boot pageerror '+errors.slice(0,5).join('\n'));
          if(!state.three||!state.orbit||!state.patch||!state.visual||state.loading!=='none'||state.fallback!=='none')throw new Error('boot state failed '+JSON.stringify(state));
          const v=state.visual;
          if(!v.enabled||!v.environment||!v.contactShadow||!v.vignette||v.machinedRoughness>.09||v.machinedEnv<1.7||v.brassMetalness<.9)throw new Error('PBR state failed '+JSON.stringify(v));

          const before=await page.evaluate(()=>({p:window.__v25PatchDebug.refDetails.position.toArray(),front:window.__v25PatchDebug.frontCover.visible,section:window.__v25PatchDebug.sectionFrame.visible}));
          await page.click('#explode');
          const exploded=await page.evaluate(()=>{for(let i=0;i<80;i++)window.__v25PatchDebug.updateV23(.05);return{value:document.getElementById('explodeAmount').value,p:window.__v25PatchDebug.refDetails.position.toArray()}});
          const travel=Math.hypot(...exploded.p.map((x,i)=>x-before.p[i]));
          if(exploded.value!=='72'||travel<80)throw new Error('explode regression '+JSON.stringify({exploded,travel}));

          await page.click('#cutaway');
          await page.evaluate(()=>window.__v25PatchDebug.updateV21(.016));
          const cutOff=await page.evaluate(()=>({active:document.getElementById('cutaway').classList.contains('active'),front:window.__v25PatchDebug.frontCover.visible,section:window.__v25PatchDebug.sectionFrame.visible}));
          if(cutOff.active||cutOff.front!==true||cutOff.section!==false)throw new Error('cutaway regression '+JSON.stringify(cutOff));
          await page.click('#cutaway');
          await page.evaluate(()=>window.__v25PatchDebug.updateV21(.016));
          const cutOn=await page.evaluate(()=>({active:document.getElementById('cutaway').classList.contains('active'),front:window.__v25PatchDebug.frontCover.visible,section:window.__v25PatchDebug.sectionFrame.visible}));
          if(!cutOn.active||cutOn.front!==false||cutOn.section!==true)throw new Error('cutaway restore regression '+JSON.stringify(cutOn));
          await new Promise(r=>setTimeout(r,400));
          if(errors.length)throw new Error('interaction pageerror '+errors.slice(0,5).join('\n'));
          if(bad.length)throw new Error('HTTP errors '+bad.join('\n'));
          console.log('MOBILE_BOOT=PASS');console.log('PBR_RUNTIME=PASS');console.log('EXPLODE=PASS');console.log('CUTAWAY=PASS');

          const desk=await browser.newPage();
          await desk.setViewport({width:1536,height:960,deviceScaleFactor:1});
          const deskErrors=[];desk.on('pageerror',e=>deskErrors.push(e.stack||e.message));
          await desk.goto('http://127.0.0.1:8000/diesel-engine-3d-sim/versions/v25-direct.html?ci=pbr-preview',{waitUntil:'networkidle0',timeout:30000});
          await new Promise(r=>setTimeout(r,1800));
          if(deskErrors.length)throw new Error('desktop pageerror '+deskErrors.slice(0,5).join('\n'));
          await desk.screenshot({path:'/tmp/v25-studio-pbr-preview.png'});
          console.log('DESKTOP_PREVIEW=PASS');
          await browser.close();
          JS
          node ./v25-pbr-test.mjs
          rm -f ./v25-pbr-test.mjs
          printf 'MOBILE_CHROMIUM_BOOT=PASS\nPBR_RUNTIME=PASS\nVISIBLE_EXPLODE=PASS\nVISIBLE_CUTAWAY=PASS\nDESKTOP_PREVIEW=PASS\n' >> diesel-engine-3d-sim/logs/v25-direct-build.txt

      - name: Upload visual preview
        uses: actions/upload-artifact@v4
        with:
          name: v25-studio-pbr-preview
          path: /tmp/v25-studio-pbr-preview.png
          retention-days: 7

      - name: Commit validated PBR build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diesel-engine-3d-sim/versions/v25-direct.html diesel-engine-3d-sim/logs/v25-direct-build.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build validated V25 studio PBR lighting pass'
          git push
