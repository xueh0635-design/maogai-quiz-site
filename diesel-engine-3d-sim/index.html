<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>四冲程柴油机 3D 仿真 · V17</title>
  <style>html,body,#frame{margin:0;width:100%;height:100%;border:0;background:#03070b}#msg{position:fixed;inset:0;display:grid;place-items:center;color:#eef7ff;font:14px system-ui;text-align:center;background:#03070b;z-index:2}</style>
</head>
<body>
<div id="msg">正在载入柴油机 3D 仿真 v17 · CAD-Like Cutaway…</div>
<iframe id="frame" title="四冲程柴油机 3D 仿真"></iframe>
<script>
(async()=>{
  try{
    const q=new URLSearchParams(location.search), requested=q.get('version');
    if(['v13','v14','v15','v16'].includes(requested)){location.replace('versions/'+requested+'.html');return;}
    const target=requested==='v12'?'v12':'v17';
    const names=['part-00.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt'];
    const parts=[];
    for(const n of names){const r=await fetch('payloads/'+target+'/'+n+'?b=202608150232',{cache:'no-store'});if(!r.ok)throw new Error(n+' HTTP '+r.status);parts.push((await r.text()).trim())}
    const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
    if(!window.DecompressionStream)throw new Error('浏览器版本过旧，不支持 gzip 解压');
    const text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.getElementById('frame').src=URL.createObjectURL(new Blob([text],{type:'text/html'}));
    document.getElementById('msg').remove();
  }catch(e){document.getElementById('msg').textContent='载入失败：'+(e.message||e)}
})();
</script>
</body></html>
