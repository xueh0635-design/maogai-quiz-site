<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四冲程柴油机 3D 仿真 V4</title><style>html,body,#frame{margin:0;width:100%;height:100%;border:0;background:#070b10}#msg{position:fixed;inset:0;display:grid;place-items:center;color:#eaf1f8;font:14px system-ui;text-align:center;background:#070b10}</style></head><body><div id="msg">正在载入 V4 Mechanical…</div><iframe id="frame" title="四冲程柴油机 3D 仿真 V4"></iframe><script>(async()=>{try{const names=['part-00.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt'];const parts=[];for(const n of names){const r=await fetch('payloads/v4/'+n);if(!r.ok)throw new Error(n+' HTTP '+r.status);parts.push((await r.text()).trim())}const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));if(!window.DecompressionStream)throw new Error('浏览器版本过旧，不支持 gzip 解压');const text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const url=URL.createObjectURL(new Blob([text],{type:'text/html'}));document.getElementById('frame').src=url;document.getElementById('msg').remove()}catch(e){document.getElementById('msg').textContent='载入失败：'+(e.message||e)}})();</script></body></html>
