<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>四冲程柴油机 3D 仿真 · V25</title><style>html,body,#frame{margin:0;width:100%;height:100%;border:0;background:#02070c}#msg{position:fixed;inset:0;display:grid;place-items:center;color:#eef7ff;font:14px system-ui;text-align:center;background:#02070c;z-index:2}</style></head>
<body><div id="msg">正在载入柴油机 3D 仿真 v25 · Local Three…</div><iframe id="frame" title="四冲程柴油机 3D 仿真"></iframe><script>
(async()=>{try{const q=new URLSearchParams(location.search),v=q.get('version');
if(!v||v==='v25'){location.replace('versions/v25.html?build=v25-mobile-boot4b-local-three&cb=202608150702');return}
if(['v13','v14','v15','v16','v17','v19','v20','v21','v22','v23','v24'].includes(v)){location.replace('versions/'+v+'.html');return}
let names,base;if(v==='v12'){names=['part-00.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt'];base='payloads/v12/'}else if(v==='v18'){names=Array.from({length:14},(_,i)=>'seg-'+String(i).padStart(2,'0')+'.txt');base='payloads/v18/'}else{location.replace('versions/v25.html?build=v25-mobile-boot4b-local-three&cb=202608150702');return}
const parts=[];for(const n of names){const r=await fetch(base+n+'?b=202608150702',{cache:'no-store'});if(!r.ok)throw new Error(n+' HTTP '+r.status);parts.push((await r.text()).trim())}const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));if(!window.DecompressionStream)throw new Error('浏览器版本过旧，不支持 gzip 解压');const text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.getElementById('frame').src=URL.createObjectURL(new Blob([text],{type:'text/html'}));document.getElementById('msg').remove()}catch(e){document.getElementById('msg').textContent='载入失败：'+(e.message||e)}})();
</script></body></html>
