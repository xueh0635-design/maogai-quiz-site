<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>四冲程柴油机 3D 仿真 · V14</title>
  <style>
    html,body,#frame{margin:0;width:100%;height:100%;border:0;background:#03070b}
    #msg{position:fixed;inset:0;display:grid;place-items:center;color:#eef7ff;font:14px system-ui;text-align:center;background:#03070b;z-index:2}
  </style>
</head>
<body>
<div id="msg">正在载入柴油机 3D 仿真 v14 · Mechanical Coherence…</div>
<iframe id="frame" title="四冲程柴油机 3D 仿真"></iframe>
<script>
(async()=>{
  try{
    const requested=new URLSearchParams(location.search).get('version');
    if(requested==='v13'){
      location.replace('versions/v13.html');
      return;
    }
    const target=requested==='v12'?'v12':'v14';
    const names=['part-00.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt'];
    const parts=[];
    for(const n of names){
      const r=await fetch('payloads/v12/'+n,{cache:'no-store'});
      if(!r.ok) throw new Error(n+' HTTP '+r.status);
      parts.push((await r.text()).trim());
    }
    const encoded=parts.join('');
    const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
    if(!window.DecompressionStream) throw new Error('浏览器版本过旧，不支持 gzip 解压');
    let text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();

    if(target==='v14'){
      text=text.replaceAll('v12','v14').replaceAll('V12','V14');
      text=text.replace('GitHub stable · v14 · BALANCED PBR','GitHub stable · v14 · MECHANICAL COHERENCE');

      /* V14: keep the proven V12 kinematics / flow / charts intact.
         Only remove the mechanically invalid thick transverse shaft seen in the
         mid-height cylinder/rod region.  Do NOT add another valvetrain architecture
         on top of the existing model; V13 remains preserved as a historical version. */
      const patch=`<script>(()=>{
        const apply=()=>{
          try{
            if(typeof THREE==='undefined'||typeof scene==='undefined') return setTimeout(apply,120);
            const info=o=>{const b=new THREE.Box3().setFromObject(o),s=new THREE.Vector3(),c=new THREE.Vector3();b.getSize(s);b.getCenter(c);return{s,c}};
            const hidden=[];
            const shafts=[];
            scene.traverse(o=>{
              if(!o?.isMesh||!o.geometry)return;
              try{
                const type=String(o.geometry.type||'').toLowerCase();
                if(!type.includes('cylinder'))return;
                const {s,c}=info(o),gp=o.geometry.parameters||{};
                const radius=Math.max(Number(gp.radiusTop||0),Number(gp.radiusBottom||0),Number(gp.radius||0));
                const h=Number(gp.height||0);
                /* Exact defect signature from the user screenshot:
                   long left-right cylinder, thick section, central Z band,
                   above crankcase and below the head. */
                const invalidCenterShaft=
                  s.x>320 && s.y<120 && s.z<120 &&
                  c.y>175 && c.y<325 && Math.abs(c.z)<95 &&
                  h>280 && radius>=18;
                if(invalidCenterShaft)shafts.push({o,s,c});
              }catch(e){}
            });
            for(const q of shafts){
              q.o.visible=false;hidden.push(q.o);
              /* Remove only boss/disc cylinders sharing the same erroneous axis.
                 This avoids leaving the floating collars that were visible around it. */
              if(q.o.parent)q.o.parent.traverse(sib=>{
                if(!sib?.isMesh||sib===q.o||!sib.geometry)return;
                try{
                  if(!String(sib.geometry.type||'').toLowerCase().includes('cylinder'))return;
                  const z=info(sib);
                  const sameAxis=Math.abs(z.c.y-q.c.y)<38&&Math.abs(z.c.z-q.c.z)<45;
                  const collar=z.s.x<125&&z.s.y<110&&z.s.z<110&&Math.max(z.s.y,z.s.z)>24;
                  const withinSpan=Math.abs(z.c.x-q.c.x)<q.s.x*.58;
                  if(sameAxis&&collar&&withinSpan){sib.visible=false;hidden.push(sib)}
                }catch(e){}
              });
            }
            console.info('[Diesel V14] invalid center shaft candidates:',shafts.length,'hidden objects:',hidden.length);
            /* Preserve V12 balanced lighting.  V13's extra lights and additive DOHC
               carrier are intentionally not injected in V14. */
            if(typeof renderer!=='undefined'&&renderer.toneMappingExposure>1.12)renderer.toneMappingExposure=1.06;
            if(typeof camera!=='undefined'&&matchMedia('(max-width:900px)').matches){camera.fov=Math.min(camera.fov,34);camera.updateProjectionMatrix()}
          }catch(e){console.warn('V14 mechanical coherence patch',e)}
        };
        setTimeout(apply,120);
      })()<\/script>`;
      text=text.replace('</body>',patch+'</body>');
    }

    const url=URL.createObjectURL(new Blob([text],{type:'text/html'}));
    document.getElementById('frame').src=url;
    document.getElementById('msg').remove();
  }catch(e){
    document.getElementById('msg').textContent='载入失败：'+(e.message||e);
  }
})();
</script>
</body>
</html>
