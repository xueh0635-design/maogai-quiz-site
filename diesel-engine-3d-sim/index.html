<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四冲程柴油机 3D 仿真</title><style>html,body,#frame{margin:0;width:100%;height:100%;border:0;background:#070b10}#msg{position:fixed;inset:0;display:grid;place-items:center;color:#eaf1f8;font:14px system-ui;text-align:center;background:#070b10;z-index:2}</style></head><body><div id="msg">正在载入柴油机 3D 仿真 v8…</div><iframe id="frame" title="四冲程柴油机 3D 仿真"></iframe><script>(async()=>{try{const requested=new URLSearchParams(location.search).get('version');const target=requested==='v4'?'v4':requested==='v7'?'v7':'v8';const base=target==='v4'?'v4':'v7';const names=['part-00.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt'];const parts=[];for(const n of names){const r=await fetch('payloads/'+base+'/'+n,{cache:'no-store'});if(!r.ok)throw new Error(n+' HTTP '+r.status);parts.push((await r.text()).trim())}const encoded=parts.join('');const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));if(!window.DecompressionStream)throw new Error('浏览器版本过旧，不支持 gzip 解压');let text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();if(target==='v8'){text=text.replace('v7','v8').replace('V7','V8');text=text.replace('oilFlow=11+rpm*.013;coolantFlow=25+rpm*.036;','oilFlow=(11+rpm*.013)*(0.82+load*.0033);coolantFlow=(25+rpm*.036)*(0.78+load*.0040);');const anchor='const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x071019,0.00135);';const ibl=`${anchor}\nif('physicallyCorrectLights' in renderer)renderer.physicallyCorrectLights=true;try{const es=new THREE.Scene();es.background=new THREE.Color(0x0b1520);const room=new THREE.Mesh(new THREE.BoxGeometry(1200,900,1200),new THREE.MeshBasicMaterial({color:0x172635,side:THREE.BackSide}));es.add(room);const p1=new THREE.Mesh(new THREE.PlaneGeometry(360,180),new THREE.MeshBasicMaterial({color:0xe8f4ff,side:THREE.BackSide}));p1.position.set(0,180,-470);es.add(p1);const p2=new THREE.Mesh(new THREE.PlaneGeometry(260,420),new THREE.MeshBasicMaterial({color:0x5e8eb8,side:THREE.BackSide}));p2.position.set(-470,80,0);p2.rotation.y=Math.PI/2;es.add(p2);const p3=new THREE.Mesh(new THREE.PlaneGeometry(220,360),new THREE.MeshBasicMaterial({color:0xffb67b,side:THREE.BackSide}));p3.position.set(470,-20,120);p3.rotation.y=-Math.PI/2;es.add(p3);const rt=new THREE.WebGLCubeRenderTarget(128,{generateMipmaps:true,minFilter:THREE.LinearMipmapLinearFilter});const cc=new THREE.CubeCamera(.1,2000,rt);es.add(cc);cc.update(renderer,es);scene.environment=rt.texture}catch(e){console.warn('Studio IBL unavailable',e)}`;text=text.replace(anchor,ibl)}const url=URL.createObjectURL(new Blob([text],{type:'text/html'}));document.getElementById('frame').src=url;document.getElementById('msg').remove()}catch(e){document.getElementById('msg').textContent='载入失败：'+(e.message||e)}})();</script></body></html>
