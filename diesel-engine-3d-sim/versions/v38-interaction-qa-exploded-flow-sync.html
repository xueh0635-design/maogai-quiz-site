<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>直列四缸柴油机 · V38 Interaction QA + Exploded Flow Sync</title><style>html,body,#stage{margin:0;width:100%;height:100%;border:0;background:#02070c;overflow:hidden}#boot{position:fixed;inset:0;display:grid;place-items:center;z-index:60;background:#02070c;color:#dff4ff;font:14px system-ui;text-align:center}</style></head><body><div id="boot">正在进入 V38 · 爆炸流动同步 / 相位与交互自动验收…</div><iframe id="stage" src="v37-runtime-regression-flow-fix.html?v38base=1"></iframe><script>
const outer=document.getElementById('stage');let tries=0,done=false;outer.addEventListener('load',()=>setTimeout(applyV38,4200));setTimeout(()=>{if(!done)applyV38()},9000);
function deepest(){let f=outer,w=f.contentWindow,d=f.contentDocument;for(let i=0;i<7;i++){const n=d&&d.getElementById('stage');if(!n)break;f=n;w=f.contentWindow;d=f.contentDocument}return{w,d}}
function applyV38(){if(done)return;tries++;const {w,d}=deepest(),T=w&&w.THREE,p=w&&w.__v25PatchDebug;if(!T||!p||!p.refRoot||!w.__v37Debug){if(tries<34)return setTimeout(applyV38,900);document.getElementById('boot').textContent='V38 初始化失败：V37/WebGL 基础层未完成';return}done=true;const scene=p.refRoot.parent,camera=[...scene.children].find(o=>o.isCamera),canvas=d.getElementById('canvas3d');
const style=d.createElement('style');style.textContent=`#v37mode,#v37qa{display:none!important}#v38mode{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:10;padding:5px 11px;border:1px solid rgba(72,197,255,.62);border-radius:999px;background:rgba(2,9,15,.82);color:#d2f3ff;font:10px system-ui;pointer-events:none}#v38qa{position:absolute;right:12px;bottom:8px;z-index:140;padding:7px 10px;border-radius:8px;background:rgba(3,11,17,.96);border:1px solid rgba(91,210,255,.5);font:9px system-ui;pointer-events:none;max-width:355px;line-height:1.45}`;d.head.appendChild(style);const badge=d.querySelector('.qualityBadge');if(badge)badge.textContent='V38 · INTERACTION QA · EXPLODED FLOW SYNC';const dep=d.getElementById('deployBadge');if(dep)dep.textContent='GitHub stable · v38 · PHASE / HOVER / PV / EXPLODE REGRESSION';
const corrected=scene.getObjectByName('V37 Corrected Flow Visualization');const coolant=scene.getObjectByName('V37 Coolant Flow'),oil=scene.getObjectByName('V37 Oil Flow'),fuel=scene.getObjectByName('V37 Fuel Flow');const exSlider=d.getElementById('explodeAmount'),exBtn=d.getElementById('explode');
function syncExplodedFlows(){const e=exSlider?Math.max(0,Math.min(1,(+exSlider.value||0)/100)):0;const alpha=1-T.MathUtils.smoothstep(e,.08,.32);for(const g of [coolant,oil,fuel])if(g){g.userData.v38ExplodeAlpha=alpha;g.traverse(o=>{if(o.isMesh&&o.material&&o.material.transparent)o.material.opacity=.86*alpha});if(e>.38)g.visible=false}if(corrected)corrected.userData.v38Explosion=e}
if(exSlider)exSlider.addEventListener('input',syncExplodedFlows,true);if(exBtn)exBtn.addEventListener('click',()=>setTimeout(syncExplodedFlows,100),true);syncExplodedFlows();
const mode=d.createElement('div');mode.id='v38mode';mode.textContent='V38 · 爆炸视图自动淡出流线 · 相位 / Hover / P–V / 多视角自动回归';d.getElementById('app').appendChild(mode);
function click(el){if(el)el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:w}))}function input(el,val){if(!el)return;el.value=String(val);el.dispatchEvent(new Event('input',{bubbles:true}))}function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function canvasVariance(cv){try{const c=cv.getContext('2d'),im=c.getImageData(0,0,Math.min(cv.width,180),Math.min(cv.height,120)).data;let min=255,max=0,n=0;for(let i=0;i<im.length;i+=16){const v=im[i]+im[i+1]+im[i+2];min=Math.min(min,v);max=Math.max(max,v);n++}return n>20&&(max-min)>45}catch(e){return false}}
async function phaseProbe(scrub,deg){input(scrub,deg);await wait(180);return{phase:(d.getElementById('phase')?.textContent||''),inlet:(d.getElementById('intakeState')?.textContent||''),exhaust:(d.getElementById('exhaustState')?.textContent||''),angle:(d.getElementById('angle')?.textContent||'')}}
async function hoverProbe(){if(!canvas||!camera)return false;let target=scene.getObjectByName('Full Flow Oil Filter')||scene.getObjectByName('Crank Damper Pulley')||scene.getObjectByName('Cam Bearing Bridge');if(!target)return false;const wp=new T.Vector3();target.getWorldPosition(wp);const q=wp.clone().project(camera),r=canvas.getBoundingClientRect();if(Math.abs(q.x)>1.05||Math.abs(q.y)>1.05)return false;const x=r.left+(q.x*.5+.5)*r.width,y=r.top+(-q.y*.5+.5)*r.height;canvas.dispatchEvent(new PointerEvent('pointermove',{clientX:x,clientY:y,bubbles:true,pointerType:'mouse'}));await wait(140);return d.getElementById('tooltip')?.style.display==='block'}
async function runQA(){const result={},scrub=d.getElementById('crankScrub'),pv=d.getElementById('pvSide');let meshes=0;scene.traverse(o=>{if(o.isMesh)meshes++});result.baseV37=!!w.__v37Debug?.ok;result.meshDensity=meshes>500;result.pvRendered=!!pv&&canvasVariance(pv);const p90=await phaseProbe(scrub,90),p270=await phaseProbe(scrub,270),p450=await phaseProbe(scrub,450),p630=await phaseProbe(scrub,630);result.phaseCycle=/吸气/.test(p90.phase)&&/压缩/.test(p270.phase)&&/做功/.test(p450.phase)&&/排气/.test(p630.phase);result.valveCycle=/开启/.test(p90.inlet)&&/开启/.test(p630.exhaust);const old=+scrub?.value||0;input(scrub,old);
 const slider=exSlider;if(slider){input(slider,0);await wait(80);const a0=coolant?.userData.v38ExplodeAlpha??-1;input(slider,55);await wait(120);const a1=coolant?.userData.v38ExplodeAlpha??-1;result.explodedFlowSync=a0>.9&&a1<.15;input(slider,0)}else result.explodedFlowSync=false;
 const views=[...d.querySelectorAll('[data-view]')];if(camera&&views.length>=4){const pts=[];for(const b of views.slice(0,4)){click(b);await wait(70);pts.push(camera.position.clone())}let distinct=0;for(let i=1;i<pts.length;i++)if(pts[i].distanceTo(pts[0])>100)distinct++;result.multiView=distinct>=2;const front=d.querySelector('[data-view="front"]');if(front)click(front)}else result.multiView=false;
 result.hoverCard=await hoverProbe();result.controls=!!d.getElementById('explode')&&!!d.getElementById('cutaway')&&!!d.getElementById('play');result.flowGroups=!!coolant&&!!oil&&!!fuel;result.webgl=!!canvas&&!!T;result.performanceFrames=(w.__v37Debug?.frames||0)>0;
 const failed=Object.entries(result).filter(([k,v])=>v!==true).map(([k])=>k);w.__v38Debug={ok:failed.length===0,checks:result,failed,sceneMeshes:meshes,phaseSamples:{p90,p270,p450,p630},explodedFlowPolicy:'fade 8%-32%, hidden above 38%',screenQA:'automated DOM/WebGL-state regression only; no independent screenshot comparison',referenceQA:'primary MP4 not re-read this run'};let qa=d.getElementById('v38qa');if(!qa){qa=d.createElement('div');qa.id='v38qa';d.body.appendChild(qa)}qa.textContent=failed.length?`V38 QA CHECK · ${failed.join(', ')} · ${meshes} meshes`:`V38 QA PASS · phase/valves/P–V/views/Hover/explode-flow verified · ${meshes} meshes`;qa.style.color=failed.length?'#ffd479':'#79e5ad';}
setTimeout(runQA,1800);document.getElementById('boot')?.remove()}
</script></body></html>
