const root=new T.Group();root.name='V37 Corrected Flow Visualization';scene.add(root);const coolant=new T.Group(),oil=new T.Group(),fuel=new T.Group();coolant.name='V37 Coolant Flow';oil.name='V37 Oil Flow';fuel.name='V37 Fuel Flow';root.add(coolant,oil,fuel);const makeMat=c=>new T.MeshBasicMaterial({color:c,transparent:true,opacity:.86,depthWrite:false,blending:T.AdditiveBlending});const MC=makeMat(0x28a8ff),MO=makeMat(0xffc23d),MF=makeMat(0xff7155);function dot(m,r=4){return new T.Mesh(new T.SphereGeometry(r,10,8),m)}function curve(points){return new T.CatmullRomCurve3(points.map(v=>new T.Vector3(...v)))}function stream(group,points,m,count,r,name){const c=curve(points),arr=[];for(let i=0;i<count;i++){const o=dot(m,r);o.name=name;o.userData.t=i/count;group.add(o);arr.push(o)}return{c,arr}}

 const side=d.querySelector('[data-view="side"]'),frontBtn=d.querySelector('[data-view="front"]');if(side&&frontBtn){click(side);click(frontBtn);result.viewButtons=true}else result.viewButtons=false;
 const fuelSys=d.querySelector('.systems .sys[data-system="fuel"]'),allSys=d.querySelector('.systems .sys[data-system="all"]');if(fuelSys&&allSys){click(fuelSys);result.systemIsolation=fuel.visible&&!oil.visible&&!coolant.visible;click(allSys);result.systemRestore=systemVisible('fuel')&&systemVisible('oil')&&systemVisible('cooling')}else{result.systemIsolation=false;result.systemRestore=false}
 const failed=Object.entries(result).filter(([k,v])=>typeof v==='boolean'&&!v).map(([k])=>k);w.__v37Debug={ok:failed.length===0,checks:result,failed,sceneMeshes:meshes,frames,flowGroups:{coolant:coolant.children.length,oil:oil.children.length,fuel:fuel.children.length},screenQA:'not independently captured',networkQA:'GitHub Pages not reachable from isolated runner'};const qa=d.createElement('div');qa.id='v37qa';qa.textContent=failed.length?`V37 regression CHECK · failed: ${failed.join(', ')}`:`V37 regression PASS · ${meshes} meshes · cutaway/explode/views/system isolation verified`;qa.style.color=failed.length?'#ffd479':'#79e5ad';d.body.appendChild(qa)}setTimeout(runRegression,2800);const b=document.getElementById('boot');if(b)b.remove()}
