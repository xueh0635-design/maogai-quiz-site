const stage=document.getElementById('stage'),boot=document.getElementById('boot');let installed=false,revealed=false,tries=0,timer=0,guardTimer=0;const started=performance.now();
function chain(){const a=[];let f=stage;for(let i=0;i<20;i++){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d)break;a.push({f,w,d});const n=d.getElementById('stage');if(!n||!n.contentWindow)break;f=n}catch(e){break}}return a}

 const sectionBad=new Set(['Deck Section Face','Main Bearing Split Section','Opened Block Side Section','Head Deck Section Face','Cam Carrier Section Face','Opened Cylinder Head Side Section']);
 const hardHideAlways=new Set(['Cast Iron Cylinder Block','Crossflow Cylinder Head']);

 const hiddenSlabs=new Set(),trackedShells=new Map(),autoSuppressed=new Map();
 function dims(o){try{const g=o.geometry;if(!g)return null;if(!g.boundingBox)g.computeBoundingBox();if(!g.boundingBox)return null;const v=new T.Vector3();g.boundingBox.getSize(v);return [Math.abs(v.x),Math.abs(v.y),Math.abs(v.z)].sort((a,b)=>b-a)}catch(e){return null}}
 function mats(o){return Array.isArray(o.material)?o.material:[o.material]}
 function isSectionLike(o){return /section|cut|lip/i.test((o.name||'')+' '+(o.parent&&o.parent.name||''))}
 function isWarm(m){if(!m||!m.color)return false;const c=m.color;return c.r>.30&&c.r>c.g*1.16&&c.r>c.b*1.12}
 function isCut(){return d.getElementById('cutaway')?.classList.contains('active')===true}
 function initTracked(){scene.traverse(o=>{if(!o.isMesh&&!o.isInstancedMesh)return;const n=o.name||'';if(hardHideAlways.has(n)||cutawayHide.has(n)){if(!trackedShells.has(o))trackedShells.set(o,o.visible);if(hardHideAlways.has(n))o.visible=false;if(cutawayHide.has(n)){for(const m of mats(o)){if(!m||!m.color)continue;m.color.setHex(0x4b5357);if('roughness' in m)m.roughness=Math.max(.46,m.roughness||0);if('metalness' in m)m.metalness=Math.min(.74,Number.isFinite(m.metalness)?m.metalness:.6)}}}})}
 function scrub(){initTracked();const cut=isCut();let sectionHidden=0,warmHidden=0,depthFixed=0,scanned=0;
  for(const [o,initial] of trackedShells){const n=o.name||'';if(hardHideAlways.has(n)){o.visible=false;continue}if(cutawayHide.has(n)){o.visible=cut?false:initial}}
  scene.traverse(o=>{if(!o.isMesh&&!o.isInstancedMesh)return;scanned++;const n=o.name||'',mm=mats(o),ds=dims(o),sectionLike=isSectionLike(o),slab=!!ds&&ds[0]>240&&ds[1]>80&&ds[2]<32,red=mm.some(isWarm);
   if(sectionBad.has(n)||(sectionLike&&slab&&red)){o.visible=false;o.userData.v56SectionSlabDisabled=true;hiddenSlabs.add(n||o.uuid);sectionHidden++;return}
   if(sectionLike){for(const m of mm){if(!m)continue;if('depthTest' in m&&m.depthTest===false){m.depthTest=true;depthFixed++}if('depthWrite' in m)m.depthWrite=false;if(m.transparent&&'opacity' in m)m.opacity=Math.min(Number.isFinite(m.opacity)?m.opacity:1,.76);if('polygonOffset' in m){m.polygonOffset=true;m.polygonOffsetFactor=-1;m.polygonOffsetUnits=-1}}o.renderOrder=Math.min(o.renderOrder||0,6)}

  });
  if(!cut){for(const [o,was] of autoSuppressed){if(!sectionBad.has(o.name||'')&&!hardHideAlways.has(o.name||''))o.visible=was}autoSuppressed.clear()}
  w.__v56Debug=w.__v56Debug||{};Object.assign(w.__v56Debug,{scanned,cutaway:cut,trackedShells:trackedShells.size,hiddenSectionSlabs:hiddenSlabs.size,autoSuppressed:cut?autoSuppressed.size:0,sectionHidden,warmHidden,depthFixed,lastScrubMs:Math.round(performance.now()-started)});return true}
 function hideLegacyOverlays(){['v51ref','v52ref','v53ref','v54fix','v55fix','v51qa','v52qa','v53qa','v54qa','v55qa'].forEach(id=>{const e=d.getElementById(id);if(e)e.style.display='none'})}
 function countRemaining(){let section=0,warm=0;const cut=isCut();scene.traverse(o=>{if(!o.isMesh&&!o.isInstancedMesh||!o.visible)return;const ds=dims(o),mm=mats(o);if(isSectionLike(o)&&ds&&ds[0]>240&&ds[1]>80&&ds[2]<32&&mm.some(isWarm))section++;if(cut&&ds&&ds[0]>260&&ds[1]>130&&mm.some(m=>m&&m.transparent&&Number.isFinite(m.opacity)&&m.opacity<=.66&&isWarm(m)))warm++});return{section,warm}}
 scrub();hideLegacyOverlays();
 if(!installed){installed=true;const cut=d.getElementById('cutaway'),exp=d.getElementById('explodeAmount'),explode=d.getElementById('explode'),reset=d.getElementById('reset');cut&&cut.addEventListener('click',()=>setTimeout(scrub,80),true);exp&&exp.addEventListener('input',()=>setTimeout(scrub,0),true);explode&&explode.addEventListener('click',()=>setTimeout(scrub,90),true);reset&&reset.addEventListener('click',()=>setTimeout(scrub,120),true);d.querySelectorAll('.systems .sys,#systemChecks input').forEach(el=>el.addEventListener('click',()=>setTimeout(scrub,70),true));let passes=0;guardTimer=w.setInterval(()=>{scrub();hideLegacyOverlays();passes++;if(passes>=120)w.clearInterval(guardTimer)},200);
  const css=d.createElement('style');css.textContent='#v56fix{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:370;padding:5px 9px;border-radius:999px;background:rgba(2,10,16,.92);border:1px solid rgba(121,229,173,.60);color:#dff8e9;font:9px system-ui;pointer-events:none;white-space:nowrap}@media(max-width:900px),(pointer:coarse){#v56fix{top:48px;font-size:8px;max-width:88vw;overflow:hidden;text-overflow:ellipsis}}';d.head.appendChild(css);const badge=d.createElement('div');badge.id='v56fix';badge.textContent='V56 · CUTAWAY SHELL HARD FIX · red shell/slab occluders suppressed';d.body.appendChild(badge);
  w.setTimeout(()=>{const cutBtn=d.getElementById('cutaway'),was=isCut();if(!was)cutBtn&&cutBtn.click();w.setTimeout(()=>{scrub();const rem=countRemaining(),ok=rem.section===0&&rem.warm===0;Object.assign(w.__v56Debug,{remainingSectionSlabs:rem.section,remainingWarmShellOccluders:rem.warm,ok,rootCause:['V51 block casting material is saturated red and the cutaway path made the full closed-box casting transparent instead of removing the near shell','V51/V52 also contained full rectangular red section slabs','deep wrapper startup can expose the V51 canvas before V54 cleanup attaches on mobile'],fix:['hide coarse full-shell block/head when detailed replacements exist','hide V51/V52 full shell meshes during cutaway, keep internal mechanics and narrow cut lips','neutralize detailed casting color to graphite','independent top-level scene guard runs before reveal and rescans later-loaded layers']});let el=d.getElementById('v56qa');if(!el){el=d.createElement('div');el.id='v56qa';el.style.cssText='position:absolute;right:8px;bottom:8px;z-index:371;padding:6px 8px;border-radius:8px;background:rgba(3,11,17,.92);border:1px solid rgba(91,210,255,.42);font:9px system-ui;pointer-events:none';d.body.appendChild(el)}el.textContent=ok?`V56 QA PASS · red slabs 0 · warm shell occluders 0`:`V56 QA CHECK · slabs ${rem.section} · warm shells ${rem.warm}`;el.style.color=ok?'#79e5ad':'#ffd479';if(!was)cutBtn&&cutBtn.click()},180)},1400)
 }
 if(!revealed)reveal('shell-guard-applied-before-reveal');return true}
