<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>直列四缸柴油机 · V58 Zero Red Overlay</title><style>html,body,#stage{margin:0;width:100%;height:100%;border:0;background:#02070c;overflow:hidden}#boot{position:fixed;inset:0;display:grid;place-items:center;z-index:620;background:#02070c;color:#dff4ff;font:14px system-ui;text-align:center;padding:24px}</style></head><body><div id="boot">正在进入 V58 · 全场景去红 / 无粉色面 / 无红色轮廓 / 多轮自检…</div><iframe id="stage" src="v53-production-cranktrain.html?v58base=1&cb=20260816-0108" title="V58 柴油机 3D 仿真"></iframe><script>
const stage=document.getElementById('stage'),boot=document.getElementById('boot');
let installed=false,revealed=false,tries=0,timer=0,verifyTimer=0,stablePasses=0,scanPasses=0;
const started=performance.now();
function chain(){const a=[];let f=stage;for(let i=0;i<18;i++){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d)break;a.push({f,w,d});const n=d.getElementById('stage');if(!n||!n.contentWindow)break;f=n}catch(e){break}}return a}
function runtime(){const a=chain();for(let i=a.length-1;i>=0;i--){const q=a[i],p=q.w&&q.w.__v25PatchDebug;if(q.w&&q.w.THREE&&p?.refRoot&&q.d.getElementById('canvas3d'))return q}return null}
function hideBoots(){for(const {d} of chain()){const b=d.getElementById('boot');if(b){b.style.display='none';b.style.pointerEvents='none'}}}
function reveal(reason){if(revealed)return;hideBoots();revealed=true;boot?.remove();window.__v58Launch={ready:true,reason,depth:chain().length,loadMs:Math.round(performance.now()-started),stablePasses}}
function applyV58(){const q=runtime();if(!q)return false;const w=q.w,d=q.d,T=w.THREE,p=w.__v25PatchDebug,scene=p.refRoot.parent;if(!scene)return false;
 const disabledGroups=new Set(['V28 Machined Section Faces','V50 Section Faces','V51 Block Section Faces','V52 Head Section Faces','V53 Cranktrain Section Faces']);
 const outerShellNames=new Set(['Cast Iron Cylinder Block','Crossflow Cylinder Head','Upper Cylinder Barrel Casting','Deep Skirt Crankcase Casting','Machined Deck Face','Main Bearing Split Line','Lower Bedplate Rail','Cylinder Head Lower Casting','Upper Cam Carrier Casting','Machined Head Deck','Cam Carrier Rail']);
 const hardOff=new Set(['Cast Iron Cylinder Block','Crossflow Cylinder Head']);
 const trackedShells=new Map(),sanitizedMaterials=new Set(),disabledObjects=new Set();
 const hsl={h:0,s:0,l:0};
 function mats(o){return Array.isArray(o.material)?o.material:[o.material]}
 function isRedColor(c){if(!c?.getHSL)return false;c.getHSL(hsl);return hsl.s>.22&&(hsl.h<.055||hsl.h>.94)&&hsl.l>.06}
 function materialRed(m){return !!m&&(isRedColor(m.color)||isRedColor(m.emissive))}
 function dims(o){try{const g=o.geometry;if(!g)return null;if(!g.boundingBox)g.computeBoundingBox();if(!g.boundingBox)return null;const v=new T.Vector3();g.boundingBox.getSize(v);return [Math.abs(v.x),Math.abs(v.y),Math.abs(v.z)].sort((a,b)=>b-a)}catch(e){return null}}
 function cutOn(){return d.getElementById('cutaway')?.classList.contains('active')===true}
 function overlayLike(o){const n=((o.name||'')+' '+(o.parent?.name||'')).toLowerCase();return /section|cut edge|cut lip|cut face|section reference|section edge|section face|machined section/.test(n)}
 function neutralize(m){if(!m)return;if(m.color&&isRedColor(m.color))m.color.setHex((Number.isFinite(m.metalness)&&m.metalness>.78)?0xaab3b7:0x4b5357);if(m.emissive&&isRedColor(m.emissive))m.emissive.setHex(0x000000);if('transparent'in m){m.transparent=false;m.opacity=1}if('depthTest'in m)m.depthTest=true;if('depthWrite'in m)m.depthWrite=true;if('vertexColors'in m&&m.vertexColors)m.vertexColors=false;m.needsUpdate=true;sanitizedMaterials.add(m)}
 function initShells(){scene.traverse(o=>{if(!o.isMesh&&!o.isInstancedMesh)return;if(outerShellNames.has(o.name||'')){if(!trackedShells.has(o))trackedShells.set(o,o.visible);for(const m of mats(o))neutralize(m);if(hardOff.has(o.name||''))o.visible=false}})}
 function sanitize(){scanPasses++;initShells();const cut=cutOn();let hiddenOverlay=0,hiddenRedLines=0,hiddenRedMeshes=0,recolored=0;
  for(const gname of disabledGroups){const g=scene.getObjectByName(gname);if(g){g.visible=false;disabledObjects.add(g)}}
  for(const [o,initial] of trackedShells){if(hardOff.has(o.name||'')){o.visible=false;continue}o.visible=cut?false:initial;for(const m of mats(o))neutralize(m)}
  scene.traverse(o=>{if(!o.visible)return;if(overlayLike(o)){o.visible=false;disabledObjects.add(o);hiddenOverlay++;return}const mm=mats(o),red=mm.some(materialRed),ds=dims(o);if((o.isLine||o.isLineSegments||o.isPoints||o.isSprite)&&red){o.visible=false;disabledObjects.add(o);hiddenRedLines++;return}if((o.isMesh||o.isInstancedMesh)&&red){const broad=!!ds&&ds[0]>140&&ds[1]>55;const translucent=mm.some(m=>m?.transparent&&Number.isFinite(m.opacity)&&m.opacity<.98);if(broad||translucent){o.visible=false;disabledObjects.add(o);hiddenRedMeshes++;return}for(const m of mm){if(materialRed(m)){neutralize(m);recolored++}}}});
  for(const m of sanitizedMaterials){if(m.color&&isRedColor(m.color))m.color.setHex((Number.isFinite(m.metalness)&&m.metalness>.78)?0xaab3b7:0x4b5357);if(m.emissive&&isRedColor(m.emissive))m.emissive.setHex(0x000000);if('transparent'in m){m.transparent=false;m.opacity=1}if('depthTest'in m)m.depthTest=true;if('depthWrite'in m)m.depthWrite=true;m.needsUpdate=true}
  w.__v58Debug=w.__v58Debug||{};Object.assign(w.__v58Debug,{scanPasses,cutaway:cut,hiddenOverlay,hiddenRedLines,hiddenRedMeshes,recolored,disabledTotal:disabledObjects.size,sanitizedMaterials:sanitizedMaterials.size,lastSanitizeMs:Math.round(performance.now()-started)});return audit()}
 function audit(){let visibleRedLines=0,visibleRedMeshes=0,visibleOverlay=0,visibleRedMaterials=0;scene.traverse(o=>{if(!o.visible)return;if(overlayLike(o)){visibleOverlay++;return}const mm=mats(o),redCount=mm.filter(materialRed).length;if(redCount)visibleRedMaterials+=redCount;if((o.isLine||o.isLineSegments||o.isPoints||o.isSprite)&&redCount)visibleRedLines++;if((o.isMesh||o.isInstancedMesh)&&redCount)visibleRedMeshes++});const clean=visibleOverlay===0&&visibleRedLines===0&&visibleRedMeshes===0&&visibleRedMaterials===0;Object.assign(w.__v58Debug,{clean,visibleOverlay,visibleRedLines,visibleRedMeshes,visibleRedMaterials,policy:'All red/pink scene geometry disabled or neutralized; cutaway exposes internals by hiding outer shells only.'});return clean}
 function hideLegacyUI(){['v28Mode','v49qa','v50ref','v51ref','v52ref','v53ref','v54fix','v55fix','v56fix','v57clean','v51qa','v52qa','v53qa','v54qa','v55qa','v56qa','v57qa'].forEach(id=>{const e=d.getElementById(id);if(e)e.style.display='none'})}
 function verifyLoop(){clearTimeout(verifyTimer);hideLegacyUI();const clean=sanitize();stablePasses=clean?stablePasses+1:0;if(boot)boot.textContent=`V58 全场景去红检查 ${stablePasses}/6 · 扫描 ${scanPasses} 次…`;if(stablePasses>=6){if(!installed)installGuards();if(!revealed)reveal('six-consecutive-zero-red-audits');return}verifyTimer=w.setTimeout(verifyLoop,120)}
 function installGuards(){if(installed)return;installed=true;const kick=()=>{stablePasses=0;w.setTimeout(()=>{for(let i=0;i<4;i++)w.setTimeout(()=>{hideLegacyUI();sanitize()},i*80)},0)};const cut=d.getElementById('cutaway'),reset=d.getElementById('reset'),exp=d.getElementById('explodeAmount'),explode=d.getElementById('explode');cut?.addEventListener('click',kick,true);reset?.addEventListener('click',kick,true);exp?.addEventListener('input',kick,true);explode?.addEventListener('click',kick,true);d.querySelectorAll('.systems .sys,#systemChecks input').forEach(el=>el.addEventListener('click',kick,true));let fast=0;const fastGuard=w.setInterval(()=>{hideLegacyUI();sanitize();if(++fast>=160)w.clearInterval(fastGuard)},250);w.setInterval(()=>{hideLegacyUI();sanitize()},1800);const tag=d.createElement('div');tag.id='v58tag';tag.textContent='V58';tag.style.cssText='position:absolute;right:8px;top:8px;z-index:405;padding:3px 6px;border-radius:6px;background:rgba(3,12,18,.78);border:1px solid rgba(121,229,173,.45);color:#a8f0c7;font:8px system-ui;pointer-events:none';d.body.appendChild(tag)}
 if(!installed&&!verifyTimer)verifyLoop();return true}
function poll(){clearTimeout(timer);tries++;if(applyV58())return;if(tries>180){if(boot)boot.textContent='V58 初始化失败：三维运行时未建立';window.__v58Launch={ready:false,failed:'runtime unavailable',depth:chain().length};return}if(boot)boot.textContent=`正在进入 V58 · 等待三维场景… ${Math.max(1,Math.round((performance.now()-started)/1000))}s`;timer=setTimeout(poll,140)}
stage.addEventListener('load',()=>setTimeout(poll,40));setTimeout(poll,80);
</script></body></html>
