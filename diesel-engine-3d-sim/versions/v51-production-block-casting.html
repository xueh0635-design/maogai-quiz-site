const slider=d.getElementById('explodeAmount'),tip=d.getElementById('tooltip'),canvas=d.getElementById('canvas3d');function selected(){return d.querySelector('.systems .sys.active')?.dataset.system||'all'}function checked(sys){const cb=d.querySelector(`#systemChecks input[data-vis="${sys}"]`);return !cb||cb.checked}function exp(){return Math.max(0,Math.min(1,(+slider?.value||0)/100))}
function syncSystems(){const s=selected(),base=s==='all'||s==='motion'||s==='valve'||s==='cooling';casting.visible=base;bearing.visible=s==='all'||s==='motion';liners.visible=(s==='all'||s==='motion'||s==='cooling')&&(checked('motion')||checked('cooling'));oil.visible=(s==='all'||s==='oil'||s==='motion')&&(checked('oil')||checked('motion'));service.visible=base||s==='oil';syncCutaway()}
function syncCutaway(){const cut=d.getElementById('cutaway')?.classList.contains('active')!==false;M.cast.transparent=cut;M.cast.opacity=cut?0.2:1;M.cast.depthWrite=!cut;section.visible=cut&&(selected()==='all'||selected()==='motion'||selected()==='valve'||selected()==='cooling')}

d.querySelectorAll('.systems .sys,#systemChecks input').forEach(el=>el.addEventListener('click',()=>setTimeout(syncSystems,25),true));d.getElementById('cutaway')?.addEventListener('click',()=>setTimeout(syncCutaway,60),true);d.getElementById('reset')?.addEventListener('click',()=>setTimeout(()=>{syncSystems();syncExplode()},120),true);slider?.addEventListener('input',syncExplode,true);d.getElementById('explode')?.addEventListener('click',()=>setTimeout(syncExplode,90),true);syncSystems();syncExplode();
const pick=[];root.traverse(o=>{if(o.isMesh||o.isInstancedMesh){o.userData.meta={cn:o.name||'缸体部件',en:o.name||'Block Component',mat:'V51 量产缸体参考 PBR',fn:'按现代直列四缸柴油机公开结构关系细化缸体、主轴承支承、缸套水套和主油道。',param:'TCD 3.6 L4 公布缸径 98 mm、冲程 120 mm；采用五道主轴承支承的直列四缸结构表达。',state:()=>`系统 ${selected()} · 爆炸 ${Math.round(exp()*100)}%`};pick.push(o)}});

async function qa(){const wait=ms=>new Promise(r=>setTimeout(r,ms)),checks={};checks.v50=!!v50;checks.coarseHidden=!coarse||coarse.visible===false;checks.fiveMains=bearing.children.filter(o=>o.name==='Main Bearing Cap').length===5;checks.fourLiners=liners.children.filter(o=>/Liner Outer/.test(o.name)).length===4;checks.corePlugs=service.children.filter(o=>o.name==='Water Jacket Core Plug').length===4;checks.oilGallery=!!oil.getObjectByName('Longitudinal Main Oil Gallery');const old=slider?.value;if(slider){slider.value='58';slider.dispatchEvent(new Event('input',{bubbles:true}));await wait(80);checks.explodeSeparation=bearing.position.y<-30&&liners.position.y>40&&service.position.z>60;slider.value=old;slider.dispatchEvent(new Event('input',{bubbles:true}));await wait(80);checks.explodeRestore=Math.abs(bearing.position.y)<4}else checks.explodeSeparation=false;const cut=d.getElementById('cutaway');if(cut){const was=cut.classList.contains('active');if(!was)cut.click();await wait(70);checks.cutawayCasting=M.cast.transparent&&M.cast.opacity<0.4;checks.sectionVisible=section.visible;if(!was)cut.click()}else checks.cutawayCasting=false;const failed=Object.entries(checks).filter(([,v])=>v!==true).map(([k])=>k);w.__v51Debug={ok:failed.length===0,checks,failed,reference:{primary:'DEUTZ TCD 3.6 L4 official product data',bore:98,stroke:120,cylinders:4},scope:'block casting / five main-bearing webs / liner-water-jacket / main oil gallery / service bosses',note:'Architecture-level public-reference model; not OEM proprietary manufacturing CAD or tolerances.'};let el=d.getElementById('v51qa');if(!el){el=d.createElement('div');el.id='v51qa';el.style.cssText='position:absolute;right:8px;bottom:8px;z-index:337;padding:6px 8px;border-radius:8px;background:rgba(3,11,17,.92);border:1px solid rgba(91,210,255,.42);font:9px system-ui;pointer-events:none';d.body.appendChild(el)}el.textContent=failed.length?'V51 QA CHECK · '+failed.join(', '):'V51 QA PASS · 4 liners / 5 mains / water jacket / oil gallery / explode';el.style.color=failed.length?'#ffd479':'#79e5ad'}setTimeout(qa,1800);return true}
function poll(){clearTimeout(timer);tries++;if(renderable()){if(!revealed)reveal('renderable-canvas');if(!patched)applyV51();if(!patched&&tries<100)timer=setTimeout(poll,300);return}if(tries>100){if(boot)boot.textContent='V51 初始化失败：WebGL 画布未建立';window.__v51Launch={ready:false,failed:'no renderable canvas',depth:chain().length};return}if(boot)boot.textContent=`正在进入 V51 · 量产缸体细化… ${Math.max(1,Math.round((performance.now()-started)/1000))}s`;timer=setTimeout(poll,300)}stage.addEventListener('load',()=>setTimeout(poll,100));setTimeout(poll,180);setTimeout(()=>{if(!revealed&&renderable())reveal('watchdog-renderable')},12000);
