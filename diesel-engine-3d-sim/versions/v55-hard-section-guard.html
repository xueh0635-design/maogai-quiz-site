const stage=document.getElementById('stage'),boot=document.getElementById('boot');let installed=false,revealed=false,tries=0,timer=0,guardTimer=0;const started=performance.now();
function chain(){const a=[];let f=stage;for(let i=0;i<20;i++){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d)break;a.push({f,w,d});const n=d.getElementById('stage');if(!n||!n.contentWindow)break;f=n}catch(e){break}}return a}
function runtime(){const a=chain();for(let i=a.length-1;i>=0;i--){const q=a[i],p=q.w&&q.w.__v25PatchDebug;if(q.w&&q.w.THREE&&p&&p.refRoot&&q.d.getElementById('canvas3d'))return q}return null}

function applyV55(){const q=runtime();if(!q)return false;const w=q.w,d=q.d,T=w.THREE,p=w.__v25PatchDebug,scene=p.refRoot.parent;if(!scene)return false;
 const badNames=new Set(['Deck Section Face','Main Bearing Split Section','Opened Block Side Section','Head Deck Section Face','Cam Carrier Section Face','Opened Cylinder Head Side Section']);
 const hidden=new Set();
 function dims(o){try{const g=o.geometry;if(!g)return null;if(!g.boundingBox)g.computeBoundingBox();if(!g.boundingBox)return null;const v=new T.Vector3();g.boundingBox.getSize(v);return [Math.abs(v.x),Math.abs(v.y),Math.abs(v.z)].sort((a,b)=>b-a)}catch(e){return null}}
 function isSectionLike(o){return /section|cut|lip/i.test((o.name||'')+' '+(o.parent&&o.parent.name||''))}
 function isRedish(m){if(!m||!m.color)return false;const c=m.color;return c.r>.35&&c.r>c.g*1.18&&c.r>c.b*1.08}
 function scrub(){let scanned=0,hiddenNow=0,depthFixed=0;scene.traverse(o=>{if(!o.isMesh&&!o.isInstancedMesh)return;scanned++;const name=o.name||'',mats=Array.isArray(o.material)?o.material:[o.material],ds=dims(o),sectionLike=isSectionLike(o),slab=!!ds&&ds[0]>240&&ds[1]>80&&ds[2]<32,red=mats.some(isRedish);const explicit=badNames.has(name);if(explicit||(sectionLike&&slab&&red)){o.visible=false;o.userData.v55OccluderDisabled=true;hidden.add(name||o.uuid);hiddenNow++;return}if(sectionLike){for(const m of mats){if(!m)continue;if('depthTest' in m&&m.depthTest===false){m.depthTest=true;depthFixed++}if('depthWrite' in m)m.depthWrite=false;if(m.transparent&&'opacity' in m)m.opacity=Math.min(Number.isFinite(m.opacity)?m.opacity:1,.78);if('polygonOffset' in m){m.polygonOffset=true;m.polygonOffsetFactor=-1;m.polygonOffsetUnits=-1}}o.renderOrder=Math.min(o.renderOrder||0,6)}});w.__v55Debug=w.__v55Debug||{};Object.assign(w.__v55Debug,{scanned,hiddenTotal:hidden.size,hiddenNow,depthFixed,lastScrubMs:Math.round(performance.now()-started),hiddenNames:[...hidden].slice(0,40)});return hiddenNow}
 function hideLegacyOverlays(){['v51ref','v52ref','v53ref','v54fix','v51qa','v52qa','v53qa','v54qa'].forEach(id=>{const e=d.getElementById(id);if(e)e.style.display='none'})}
 function remainingSlabs(){let n=0;scene.traverse(o=>{if(!o.isMesh&&!o.isInstancedMesh)return;const ds=dims(o),mats=Array.isArray(o.material)?o.material:[o.material];if(o.visible&&isSectionLike(o)&&ds&&ds[0]>240&&ds[1]>80&&ds[2]<32&&mats.some(isRedish))n++});return n}
 scrub();hideLegacyOverlays();
 if(!installed){installed=true;const cut=d.getElementById('cutaway'),exp=d.getElementById('explodeAmount'),explode=d.getElementById('explode'),reset=d.getElementById('reset');cut&&cut.addEventListener('click',()=>setTimeout(scrub,40),true);exp&&exp.addEventListener('input',()=>setTimeout(scrub,0),true);explode&&explode.addEventListener('click',()=>setTimeout(scrub,80),true);reset&&reset.addEventListener('click',()=>setTimeout(scrub,100),true);let passes=0;guardTimer=w.setInterval(()=>{scrub();hideLegacyOverlays();passes++;if(passes>=80)w.clearInterval(guardTimer)},200);
  const css=d.createElement('style');css.textContent='#v55fix{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:360;padding:5px 9px;border-radius:999px;background:rgba(2,10,16,.92);border:1px solid rgba(121,229,173,.56);color:#dff8e9;font:9px system-ui;pointer-events:none;white-space:nowrap}@media(max-width:900px),(pointer:coarse){#v55fix{top:64px;font-size:8px;max-width:88vw;overflow:hidden;text-overflow:ellipsis}}';d.head.appendChild(css);const badge=d.createElement('div');badge.id='v55fix';badge.textContent='V55 · HARD SECTION GUARD · oversized red slabs disabled';d.body.appendChild(badge);
  w.setTimeout(()=>{scrub();const rem=remainingSlabs();w.__v55Debug.remainingVisibleRedSlabs=rem;w.__v55Debug.ok=rem===0;let el=d.getElementById('v55qa');if(!el){el=d.createElement('div');el.id='v55qa';el.style.cssText='position:absolute;right:8px;bottom:8px;z-index:361;padding:6px 8px;border-radius:8px;background:rgba(3,11,17,.92);border:1px solid rgba(91,210,255,.42);font:9px system-ui;pointer-events:none';d.body.appendChild(el)}el.textContent=rem===0?`V55 QA PASS · red occluder slabs = 0 · hidden ${hidden.size}`:`V55 QA CHECK · remaining red slabs ${rem}`;el.style.color=rem===0?'#79e5ad':'#ffd479'},1400)
 }
