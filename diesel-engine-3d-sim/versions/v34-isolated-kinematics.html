function mesh(g,m,pos=[0,0,0],rot=[0,0,0],name=''){const o=new T.Mesh(g,m);o.position.set(...pos);o.rotation.set(...rot);o.castShadow=o.receiveShadow=true;o.name=name;return o}function cyl(r,h,m,p,rot=[0,0,0],n='',seg=36){return mesh(new T.CylinderGeometry(r,r,h,seg),m,p,rot,n)}function tube(points,r,m,n='',seg=30){const c=new T.CatmullRomCurve3(points.map(v=>new T.Vector3(...v)));const o=mesh(new T.TubeGeometry(c,seg,r,8,false),m,[0,0,0],[0,0,0],n);o.userData.curve=c;return o}function camLobe(depth=14){const s=new T.Shape(),N=72;for(let i=0;i<N;i++){const a=i/N*Math.PI*2,c=Math.max(0,Math.cos(a)),r=12+10*Math.pow(c,4.2),x=r*Math.cos(a),y=r*Math.sin(a);i?s.lineTo(x,y):s.moveTo(x,y)}s.closePath();const g=new T.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelSize:1.1,bevelThickness:1.1,bevelSegments:2});g.translate(0,0,-depth/2);return g}function springGeom(){const pts=[];for(let k=0;k<=58;k++){const t=k/58;pts.push([8.6*Math.cos(t*Math.PI*16),t*52,8.6*Math.sin(t*Math.PI*16)])}return new T.TubeGeometry(new T.CatmullRomCurve3(pts.map(v=>new T.Vector3(...v))),58,1.55,8,false)}
const X=[-180,-60,60,180],phaseOffset=[0,540,180,360],vRoot=new T.Group(),fRoot=new T.Group(),gRoot=new T.Group();vRoot.name='V34 Dynamic Valvetrain';fRoot.name='V34 Cylinder Fuel Combustion';gRoot.name='V34 Cylinder Gas Flows';scene.add(vRoot,fRoot,gRoot);const valves=[],cams=[],fx=[],flows=[],interact=[];

const crankS=scene.getObjectByName('Crank Sprocket'),inS=scene.getObjectByName('Intake Cam Sprocket'),exS=scene.getObjectByName('Exhaust Cam Sprocket');let frames=0,lastAngle=0,last=performance.now();function animate34(now){requestAnimationFrame(animate34);const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;const ai=d.getElementById('crankScrub'),a=ai?+ai.value||0:0,rad=(a%360)*Math.PI/180;lastAngle=a;cams[0].rotation.x=rad*.5;cams[1].rotation.x=rad*.5;if(crankS)crankS.rotation.x=rad;if(inS)inS.rotation.x=-rad*.5;if(exS)exS.rotation.x=-rad*.5;for(const v of valves){const la=localAngle(v.i,a),lift=valveLift(la,v.type);v.g.position.y=v.baseY-lift*1.55;v.sp.scale.y=Math.max(.72,1-lift*.012);v.ret.position.y=70-lift*.18;v.fol.rotation.z=(v.type==='in'?1:-1)*lift*.010}for(const f of fx){const la=localAngle(f.i,a),inj=injecting(la);f.spray.visible=inj;const burn=la>=352&&la<=438;f.fire.visible=burn;if(burn){const q=Math.max(.15,1-Math.abs(392-la)/72);f.fire.children.forEach((o,j)=>{o.material.opacity=.12+.58*q;o.scale.setScalar(.75+q*(.35+(j%4)*.08))})}}for(const fl of flows){const la=localAngle(fl.i,a),il=valveLift(la,'in'),el=valveLift(la,'ex'),t=now*.00035;fl.ig.visible=il>.2;fl.eg.visible=el>.2;fl.ig.children.forEach((o,j)=>o.position.copy(fl.intakeCurve.getPointAt((o.userData.u+t)%1)));fl.eg.children.forEach((o,j)=>o.position.copy(fl.exhaustCurve.getPointAt((o.userData.u+t*1.25)%1)))}const vc=d.querySelector('[data-vis="valve"]'),fc=d.querySelector('[data-vis="fuel"]'),gc=d.querySelector('[data-vis="gas"]');vRoot.visible=!vc||vc.checked!==false;fRoot.visible=!fc||fc.checked!==false;gRoot.visible=!gc||gc.checked!==false;frames++}
