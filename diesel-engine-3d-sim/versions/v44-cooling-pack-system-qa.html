function meta(o,cn,en,sys,fn){const data={cn,en,mat:'V44 工业总成',fn,param:'高复杂度系统部件',state:()=> '运行/装配状态可视化'};o.userData.meta=data;o.userData.system=sys;o.traverse(c=>{if(c.isMesh){c.userData.meta=data;c.userData.system=sys}});return o}
const pack=new T.Group();pack.name='V44 Cooling Charge-Air Pack';scene.add(pack);pack.position.set(485,260,35);

function selected(){return d.querySelector('.systems .sys.active')?.dataset.system||'all'}function checked(sys){const cb=d.querySelector(`#systemChecks input[data-vis="${sys}"]`);return !cb||cb.checked}function focusAllows(names){const s=selected();return s==='all'||names.includes(s)}function syncSystems(){if(timing)timing.visible=focusAllows(['motion','valve','fuel'])&&(checked('motion')||checked('valve')||checked('fuel'));if(airpath)airpath.visible=focusAllows(['gas'])&&checked('gas');if(rearDrive)rearDrive.visible=focusAllows(['motion'])&&checked('motion');if(cooling)cooling.visible=focusAllows(['cooling'])&&checked('cooling');if(sensors)sensors.visible=selected()==='all'||focusAllows(['motion','fuel','oil','cooling','gas']);if(fasteners)fasteners.visible=selected()==='all'||focusAllows(['motion','valve','fuel','gas','cooling']);if(section)section.visible=(d.getElementById('cutaway')?.classList.contains('active')!==false)&&focusAllows(['motion']);radFrame.visible=focusAllows(['cooling'])&&checked('cooling');fanGroup.visible=radFrame.visible;service.visible=radFrame.visible;intercooler.visible=focusAllows(['gas'])&&checked('gas');hoses.visible=(radFrame.visible||intercooler.visible)}

function wait(ms){return new Promise(r=>setTimeout(r,ms))}async function runQA(){const checks={};checks.baseV42=!!w.__v42Debug;checks.v42Healthy=w.__v42Debug?.ok===true;checks.instancing=instancers>=3&&instances>=40;checks.coolingPackMeshes=pick.length>=25;checks.radiatorFins=fins.count===74;checks.intercoolerFins=iFins.count===34;checks.fanBlades=fanGroup.children.filter(o=>o.name==='Fan Blade').length===9;const all=d.querySelector('.systems .sys[data-system="all"]'),gas=d.querySelector('.systems .sys[data-system="gas"]'),cool=d.querySelector('.systems .sys[data-system="cooling"]'),motion=d.querySelector('.systems .sys[data-system="motion"]');if(gas&&cool&&motion&&all){cool.click();await wait(90);checks.coolingIsolation=radFrame.visible&&fanGroup.visible&&!intercooler.visible;gas.click();await wait(90);checks.gasIsolation=intercooler.visible&&!radFrame.visible;motion.click();await wait(90);checks.motionIsolation=rearDrive?.visible===true&&!radFrame.visible&&!intercooler.visible;all.click();await wait(90);checks.allRestore=radFrame.visible===checked('cooling')&&intercooler.visible===checked('gas')}else checks.systemControls=false;if(explode){const old=explode.value;explode.value='55';explode.dispatchEvent(new Event('input',{bubbles:true}));await wait(80);checks.explodedPackMoves=pack.position.x>packBase.x+100;explode.value=old;explode.dispatchEvent(new Event('input',{bubbles:true}));await wait(80);checks.explodeRestore=Math.abs(pack.position.x-packBase.x)<3}else checks.explodedPackMoves=false;checks.fpsSampler=typeof fps==='number';checks.chainDepth=depth<=6;const failed=Object.entries(checks).filter(([,v])=>v!==true).map(([k])=>k);w.__v44Debug={ok:failed.length===0,checks,failed,depth,instancers,instances,coolingPackMeshes:pick.length,fps,reference:'Primary MP4 not re-read byte-for-byte in this run; benchmark comparison uses saved extracted-frame evidence.',screenQA:'Independent Chromium/WebGL screenshot evidence was not obtained in this run.'};let qa=d.getElementB
