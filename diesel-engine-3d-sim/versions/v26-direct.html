 const M={steel:new T.MeshPhysicalMaterial({color:0xd9dfe2,roughness:.12,metalness:1,clearcoat:.34,clearcoatRoughness:.1}),dark:new T.MeshPhysicalMaterial({color:0x2b3033,roughness:.42,metalness:.82}),alloy:new T.MeshPhysicalMaterial({color:0xb9c2c6,roughness:.24,metalness:.92,clearcoat:.2}),brass:new T.MeshPhysicalMaterial({color:0xb0813e,roughness:.22,metalness:.94}),iron:new T.MeshPhysicalMaterial({color:0x4b3e35,roughness:.47,metalness:.79}),red:new T.MeshPhysicalMaterial({color:0x963c32,roughness:.35,metalness:.48,clearcoat:.18}),rubber:new T.MeshStandardMaterial({color:0x050607,roughness:.95,metalness:.01})};
 function mesh(g,m,pos=[0,0,0],rot=[0,0,0],name=''){const o=new T.Mesh(g,m);o.position.set(...pos);o.rotation.set(...rot);o.castShadow=o.receiveShadow=true;o.name=name;return o}

 for(const x of X){for(const z of [-34,34])for(const dx of [-18,18]){top.add(cyl(11,5,M.steel,[x+dx,563,z],[0,0,0],'Valve Retainer',24));top.add(cyl(3.2,78,M.steel,[x+dx,522,z],[0,0,0],'Valve Stem',20))}const clamp=box(50,9,20,M.brass,[x,583,0],[0,0,.04],'Injector Clamp Detail');fuel.add(clamp);fuel.add(cyl(6,12,M.steel,[x,590,0],[0,0,0],'Injector Clamp Bolt',16))}

 for(const x of X){fuel.add(tube([[x,667,86],[x,642,76],[x+12,616,52],[x,578,12]],3.1,M.brass,'Individual High Pressure Line'));fuel.add(cyl(6.5,9,M.steel,[x,667,86],[0,0,Math.PI/2],'HP Union',16));fuel.add(tube([[x,573,-10],[x,604,-28],[x,625,-42]],2.3,M.dark,'Injector Leak-off Line'))}
 fuel.add(tube([[-205,625,-42],[205,625,-42]],4.2,M.dark,'Injector Return Rail'));
 // Four independent exhaust runners with flanges, stud pairs, pulse collector and turbine inlet.
 const ex=new T.Group();ex.name='V26 Four Branch Exhaust';gas.add(ex);for(const x of X){ex.add(box(48,42,8,M.iron,[x,468,-70],[0,0,0],'Exhaust Port Flange'));for(const dx of [-16,16])ex.add(cyl(3.5,14,M.steel,[x+dx,468,-76],[Math.PI/2,0,0],'Exhaust Stud',14));ex.add(tube([[x,463,-74],[x,445,-108],[x+(x<0?-22:22),425,-146],[x*.78,405,-184]],14,M.iron,`Cylinder ${X.indexOf(x)+1} Exhaust Runner`))}
 ex.add(tube([[-150,405,-184],[-65,395,-190],[30,397,-190],[135,408,-176],[270,420,-142]],22,M.iron,'Pulse Collector'));
 // Turbo detail: compressor/turbine snail rings, visible shaft, wheel blades, wastegate actuator and V-band clamps.
 const turbo=new T.Group();turbo.name='V26 Turbo Detail';turbo.position.set(350,420,-126);gas.add(turbo);turbo.add(torus(58,18,M.alloy,[0,0,0],[0,Math.PI/2,0],'Compressor Housing'));turbo.add(torus(54,20,M.iron,[78,0,0],[0,Math.PI/2,0],'Turbine Housing'));turbo.add(cyl(7,82,M.steel,[39,0,0],[0,0,Math.PI/2],'Turbo Shaft',24));for(let k=0;k<12;k++){const a=k/12*Math.PI*2;const blade=box(4,31,12,M.steel,[0,Math.cos(a)*19,Math.sin(a)*19],[a,0,.45],'Compressor Blade');turbo.add(blade)}turbo.add(torus(31,3,M.steel,[-28,0,0],[0,Math.PI/2,0],'Compressor V-band'));turbo.add(torus(32,3,M.steel,[106,0,0],[0,Math.PI/2,0],'Turbine V-band'));turbo.add(cyl(13,54,M.brass,[75,42,18],[0,0,Math.PI/2],'Wastegate Actuator',24));turbo.add(tube([[75,42,18],[94,28,8],[105,7,0]],3,M.brass,'Wastegate Rod'));

 const of=new T.Group();of.name='V26 Oil Filter Module';of.position.set(302,106,145);details.add(of);of.add(cyl(30,108,M.red,[0,0,0],[0,0,0],'Full-flow Oil Filter',40));of.add(cyl(34,12,M.dark,[0,57,0],[0,0,0],'Filter Head',32));for(let k=0;k<8;k++){const a=k/8*Math.PI*2;of.add(cyl(2.3,7,M.steel,[Math.cos(a)*20,63,Math.sin(a)*20],[0,0,0],'Filter Base Port',12))}details.add(tube([[300,165,145],[246,166,132],[190,146,126],[80,120,120],[-40,105,123]],5,M.brass,'Oil Filter Feed'));details.add(tube([[300,94,145],[210,90,137],[95,91,128],[-40,96,122],[-225,112,128]],4.6,M.brass,'Main Oil Gallery Feed'));
 // Extra machine-detail hardware: head studs, manifold clamps, timing fasteners.
 for(let x=-300;x<=300;x+=60){details.add(cyl(3.5,13,M.steel,[x,556,112],[0,0,0],'Head Fastener',12));details.add(cyl(3.5,13,M.steel,[x,556,-112],[0,0,0],'Head Fastener',12))}
 for(const x of X){for(const z of [-89,-64])details.add(torus(11,1.8,M.steel,[x,468,z],[Math.PI/2,0,0],'Manifold Clamp'))}
