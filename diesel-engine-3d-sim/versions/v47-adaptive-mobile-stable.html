<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>直列四缸柴油机 · V47 Adaptive Mobile Stable</title><style>html,body,#stage{margin:0;width:100%;height:100%;border:0;background:#02070c;overflow:hidden}#boot{position:fixed;inset:0;display:grid;place-items:center;z-index:300;background:#02070c;color:#dff4ff;font:14px system-ui;text-align:center;padding:24px}#mode{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:280;padding:5px 10px;border:1px solid rgba(70,190,255,.55);border-radius:999px;background:rgba(2,9,15,.82);color:#ccefff;font:10px system-ui;pointer-events:none;opacity:0;transition:opacity .2s}</style></head><body><div id="boot">正在进入 V47 · 自适应移动端稳定运行时…</div><div id="mode"></div><iframe id="stage" title="V47 柴油机 3D 仿真"></iframe><script>
const stage=document.getElementById('stage'),boot=document.getElementById('boot'),mode=document.getElementById('mode');
const coarse=matchMedia('(pointer:coarse)').matches,narrow=matchMedia('(max-width:900px)').matches,mobile=coarse||narrow;
const forceFull=new URLSearchParams(location.search).get('full')==='1';
let fallback=false,revealed=false,timer=0,started=performance.now();
const primary=mobile&&!forceFull?'v34-isolated-kinematics.html?v47-mobile=1&cb=20260815-2348':'v46-exploded-cooling-pack-fix.html?v47-full=1&cb=20260815-2348';
stage.src=primary;
function chain(){const out=[];let f=stage;for(let i=0;i<10;i++){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d)break;out.push({f,w,d});const n=d.getElementById('stage');if(!n||!n.contentWindow)break;f=n}catch(e){break}}return out}
function renderable(a){return a.some(({d})=>{const c=d.getElementById('canvas3d');return !!c&&c.width>0&&c.height>0})}
function hideBoots(a){for(const {d} of a){const b=d.getElementById('boot');if(b){b.style.display='none';b.style.pointerEvents='none'}}}
function reveal(reason){if(revealed)return;const a=chain();hideBoots(a);revealed=true;boot?.remove();mode.textContent=mobile&&!forceFull?(fallback?'V47 · 移动端稳定内核':'V47 · 移动端动态稳定内核'):'V47 · 完整 CAD 运行时';mode.style.opacity='1';setTimeout(()=>mode.style.opacity='0',3200);window.__v47Debug={ready:true,reason,mobile,forceFull,fallback,depth:a.length,canvas:renderable(a),loadMs:Math.round(performance.now()-started),policy:'mobile uses V34 dynamic core first; desktop/full uses V46; watchdog falls back to V25'}}
function useFallback(){if(fallback)return;fallback=true;started=performance.now();if(boot)boot.textContent='移动端增强运行时超时，正在切换基础稳定内核…';stage.src='v25-direct.html?v47-fallback=1&cb=20260815-2348'}
function poll(){clearTimeout(timer);const a=chain();if(renderable(a)){reveal(fallback?'v25-fallback-renderable':(mobile&&!forceFull?'mobile-v34-renderable':'full-v46-renderable'));return}const elapsed=performance.now()-started;const limit=fallback?9000:(mobile&&!forceFull?9500:18000);if(elapsed>limit){if(!fallback)useFallback();else{if(boot)boot.textContent='V47 初始化失败：基础 WebGL 画布仍未建立';window.__v47Debug={ready:false,mobile,forceFull,fallback:true,failed:'no renderable canvas after fallback',depth:a.length};return}}else if(boot){boot.textContent=`正在进入 V47 · ${mobile&&!forceFull?'移动端动态稳定内核':'完整 CAD 运行时'}… ${Math.max(1,Math.round(elapsed/1000))}s`}timer=setTimeout(poll,300)}
stage.addEventListener('load',()=>setTimeout(poll,100));setTimeout(poll,180);
setTimeout(()=>{if(!revealed){const a=chain();if(renderable(a))reveal('watchdog-renderable');else if(!fallback)useFallback()}},mobile&&!forceFull?11000:20000);
</script></body></html>
