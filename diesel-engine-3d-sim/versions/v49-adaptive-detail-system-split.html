<script>

function chain(){const out=[];let f=stage;for(let i=0;i<12;i++){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d)break;out.push({f,w,d});const n=d.getElementById('stage');if(!n||!n.contentWindow)break;f=n}catch(e){break}}return out}
function runtime(){const a=chain();for(let i=a.length-1;i>=0;i--){const q=a[i],p=q.w&&q.w.__v25PatchDebug;if(q.w&&q.w.THREE&&p?.refRoot&&q.d.getElementById('canvas3d'))return q}return null}
function renderable(){return chain().some(({d})=>{const c=d.getElementById('canvas3d');return !!c&&c.width>0&&c.height>0})}
function hideBoots(){for(const {d} of chain()){const b=d.getElementById('boot');if(b){b.style.display='none';b.style.pointerEvents='none'}}}

function applyV49(){if(patched)return true;const q=runtime();if(!q)return false;const {w,d}=q,T=w.THREE,p=w.__v25PatchDebug,scene=p.refRoot.parent;if(!scene)return false;const root=scene.getObjectByName('V48 Mobile CAD Lite');if(!root)return false;
 patched=true;
 const fuel=scene.getObjectByName('V48 Fuel'),gas=scene.getObjectByName('V48 Gas'),cooling=scene.getObjectByName('V48 Cooling'),service=scene.getObjectByName('V48 Service'),timing=scene.getObjectByName('V48 Timing');
 const pack=scene.getObjectByName('V48 Mobile Cooling Pack'),ic=scene.getObjectByName('V48 Intercooler');
 const slider=d.getElementById('explodeAmount'),canvas=d.getElementById('canvas3d'),tip=d.getElementById('tooltip');
 const css=d.createElement('style');css.textContent=`
 @media(max-width:900px),(pointer:coarse){
   body.v49-mobile #bottomDock{display:none!important;left:4px!important;right:4px!important;bottom:4px!important;max-height:38vh!important;min-height:0!important;overflow:auto!important;z-index:315!important;background:rgba(2,9,15,.97)!important;backdrop-filter:blur(12px)!important}

   body.v49-mobile #v48MobileBar{top:auto!important;bottom:max(10px,env(safe-area-inset-bottom))!important;left:50%!important;transform:translateX(-50%)!important;max-width:96vw!important;overflow-x:auto!important;white-space:nowrap!important;padding:5px!important}
   body.v49-mobile #v48MobileBar button{min-width:58px!important;padding:8px 10px!important;font-size:11px!important}
   body.v49-mobile #canvas3d{touch-action:none!important}
 }
 #v49QualityBtn{border-color:rgba(121,229,173,.52)!important}
 #v49qa{position:absolute;right:8px;bottom:8px;z-index:325;padding:6px 8px;border-radius:8px;background:rgba(3,11,17,.92);border:1px solid rgba(91,210,255,.42);font:9px system-ui;pointer-events:none;max-width:520px;line-height:1.4}
 `;d.head.appendChild(css);

 function selected(){return d.querySelector('.systems .sys.active')?.dataset.system||'all'}

 d.getElementById('cutaway')?.addEventListener('click',()=>setTimeout(syncSystems49,70),true);d.getElementById('reset')?.addEventListener('click',()=>setTimeout(syncSystems49,140),true);d.getElementById('tour')?.addEventListener('click',()=>setTimeout(syncSystems49,140),true);syncSystems49();
 const detail=new T.Group();detail.name='V49 Progressive CAD Detail';scene.add(detail);
 const matSteel=new T.MeshPhysicalMaterial({color:0xc9d2d6,roughness:.19,metalness:.95,clearcoat:.18}),matDark=new T.MeshPhysicalMaterial({color:0x161d22,roughness:.48,metalness:.72}),matRubber=new T.MeshStandardMaterial({color:0x050708,roughness:.95,metalness:.02}),matBrass=new T.MeshPhysicalMaterial({color:0xa47b42,roughness:.25,metalness:.9});
 function mesh(g,m,pos=[0,0,0],rot=[0,0,0],name=''){const o=new T.Mesh(g,m);o.position.set(...pos);o.rotation.set(...rot);o.name=name;o.castShadow=o.receiveShadow=true;return o}
 function box(x,y,z,m,pos,rot=[0,0,0],name=''){return mesh(new T.BoxGeometry(x,y,z),m,pos,rot,name)}function cyl(r,h,m,pos,rot=[0,0,0],name='',seg=20){return mesh(new T.CylinderGeometry(r,r,h,seg),m,pos,rot,name)}
 function tube(points,r,m,name=''){const c=new T.CatmullRomCurve3(points.map(v=>new T.Vector3(...v)));return mesh(new T.TubeGeometry(c,28,r,7,false),m,[0,0,0],[0,0,0],name)}
 const X=[-180,-60,60,180];detail.add(tube([[-245,652,-138],[-120,654,-138],[0,655,-138],[120,654,-138],[245,652,-138]],4.4,matRubber,'Injector Harness Trunk'));
 for(const x of X){detail.add(box(25,20,18,matDark,[x,622,-95],[0,0,0],`Cylinder ${X.indexOf(x)+1} Injector Connector`));detail.add(tube([[x,652,-138],[x+7,642,-122],[x,622,-104]],2.6,matRubber,`Cylinder ${X.indexOf(x)+1} Injector Lead`));detail.add(cyl(4,18,matBrass,[x,575,-66],[0,0,0],`Cylinder ${X.indexOf(x)+1} Injector Clamp Bolt`,14))}
 const boltGeo=new T.CylinderGeometry(4.2,4.2,18,12),boltMat=matSteel,bolts=new T.InstancedMesh(boltGeo,boltMat,16);let bi=0;for(const x of [-270,-180,-90,0,90,180,270])for(const z of [-92,92]){if(bi>=16)break;const m=new T.Matrix4().makeTranslation(x,548,z);bolts.setMatrixAt(bi++,m)}while(bi<16){bolts.setMatrixAt(bi,new T.Matrix4().makeTranslation(-225+bi*30,540,0));bi++}bolts.name='V49 Instanced Head Fasteners';detail.add(bolts);
 for(const x of [-250,-150,-50,50,150,250])detail.add(box(15,205,12,matDark,[x,250,118],[0,0,0],'Crankcase Reinforcement Rib'));
 for(const p0 of [[285,435,158],[320,410,170],[255,185,145],[-285,320,170]])detail.add(mesh(new T.TorusGeometry(12,2.4,8,24),matSteel,p0,[Math.PI/2,0,0],'Service Hose Clamp'));
 detail.traverse(o=>{if(o.isMesh||o.isInstancedMesh){o.userData.meta={cn:o.name||'机械细节',en:o.name||'Mechanical Detail',mat:'V49 自适应 PBR 细节层',fn:'补充喷油线束、紧固件、加强筋和服务连接，使移动端总成更接近工业机械表达。',param:'高细节层会根据设备帧率自动开关。',state:()=>`画质 ${qualityMode.toUpperCase()} · ${Math.round(lastFps||0)} FPS`}}});
 let qualityMode='auto',lastFps=0,detailOn=false,frames=0,fpsStart=performance.now(),samples=[];
 function applyQuality(){let on=qualityMode==='high'||(qualityMode==='auto'&&lastFps>=34);if(qualityMode==='low')on=false;detail.visible=on;detailOn=on;const qb=bar?.querySelector('[data-v49="quality"]');if(qb)qb.textContent=`画质 ${qualityMode==='auto'?'AUTO':qualityMode==='high'?'高':'省'}`;quality.textContent=`${qualityMode.toUpperCase()} · ${Math.round(lastFps||0)} FPS · ${on?'CAD+':'LITE'}`}
 function cycleQuality(){qualityMode=qualityMode==='auto'?'high':qualityMode==='high'?'low':'auto';applyQuality()}
 detail.visible=false;
 function fpsLoop(t){frames++;if(t-fpsStart>=1100){lastFps=frames*1000/(t-fpsStart);frames=0;fpsStart=t;samples.push(lastFps);if(samples.length>4)samples.shift();if(qualityMode==='auto'){const avg=samples.reduce((a,b)=>a+b,0)/samples.length;if(avg<29)lastFps=avg;else if(avg>36)lastFps=avg;applyQuality()}else applyQuality()}w.requestAnimationFrame(fpsLoop)}w.requestAnimationFrame(fpsLoop);
 canvas?.addEventListener('pointerleave',()=>{if(tip)tip.style.display='none'},true);
 function syncDetailExplosion(){const e=Math.max(0,Math.min(1,(+slider?.value||0)/100));detail.position.set(0,e*95,e*45);detail.visible=detailOn&&e<.72}
 slider?.addEventListener('input',syncDetailExplosion,true);d.getElementById('explode')?.addEventListener('click',()=>setTimeout(syncDetailExplosion,100),true);d.getElementById('reset')?.addEventListener('click',()=>setTimeout(syncDetailExplosion,130),true);syncDetailExplosion();
 async function qa(){const wait=ms=>new Promise(r=>setTimeout(r,ms)),checks={};checks.root=!!root;checks.detail=detail.children.length>=20;checks.mobileControls=!mobile||!!bar?.querySelector('[data-v49="systems"]');checks.explodeSlider=!slider||slider.id==='explodeAmount';const all=d.querySelector('.systems .sys[data-system="all"]'),gasBtn=d.querySelector('.systems .sys[data-system="gas"]'),coolBtn=d.querySelector('.systems .sys[data-system="cooling"]');if(gasBtn&&coolBtn&&all&&pack&&ic){gasBtn.click();await wait(100);checks.gasGetsIntercooler=ic.visible===true;checks.gasHidesRadiator=pack.children.filter(c=>c!==ic).every(c=>c.visible===false);coolBtn.click();await wait(100);checks.coolingHidesIntercooler=ic.visible===false;checks.coolingGetsRadiator=pack.children.some(c=>c!==ic&&c.visible===true);all.click();await wait(100);checks.allRestore=true}else checks.systemSplit=false;const oilCb=d.querySelector('#systemChecks input[data-vis="oil"]');if(oilCb&&service){const old=oilCb.checked;if(old)oilCb.click();await wait(80);checks.oilCheckboxHonored=service.visible===false;if(old)oilCb.click();await wait(80)}else checks.oilCheckboxHonored=true;checks.performanceSampler=typeof lastFps==='number';const failed=Object.entries(checks).filter(([,v])=>v!==true).map(([k])=>k);w.__v49Debug={ok:failed.length===0,checks,failed,lastFps,qualityMode,detailOn,depth:chain().length,fixes:['split intercooler into gas visibility while keeping radiator/fan in cooling','oil service group now honors Oil checkbox','mobile bottom system dock is toggleable','adaptive progressive CAD detail based on frame cadence']};let el=d.getElementById('v49qa');if(!el){el=d.createElement('div');el.id='v49qa';d.body.appendChild(el)}el.textContent=failed.length?'V49 QA CHECK · '+failed.join(', '):'V49 QA PASS · system split / oil visibility / mobile dock / adaptive detail';el.style.color=failed.length?'#ffd479':'#79e5ad'}
 setTimeout(qa,1800);return true}
function poll(){clearTimeout(pollTimer);tries++;if(renderable()){if(!revealed)reveal('renderable-canvas');if(!patched)applyV49();if(!patched&&tries<80)pollTimer=setTimeout(poll,300);return}if(tries>80){if(boot)boot.textContent='V49 初始化失败：WebGL 画布未建立';window.__v49Launch={ready:false,failed:'no renderable canvas',depth:chain().length};return}if(boot)boot.textContent=`正在进入 V49 · 系统拆分 / 自适应细节 / 移动端控制优化… ${Math.max(1,Math.round((performance.now()-started)/1000))}s`;pollTimer=setTimeout(poll,300)}
stage.addEventListener('load',()=>setTimeout(poll,100));setTimeout(poll,180);setTimeout(()=>{if(!revealed&&renderable())reveal('watchdog-renderable')},12000);
