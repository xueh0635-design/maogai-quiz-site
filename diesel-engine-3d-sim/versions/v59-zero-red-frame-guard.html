function apply(){const q=runtime();if(!q)return false;const w=q.w,d=q.d,T=w.THREE,p=w.__v25PatchDebug,scene=p.refRoot.parent;if(!scene)return false;
 const groups=['V28 Machined Section Faces','V50 Section Faces','V51 Block Section Faces','V52 Head Section Faces','V53 Cranktrain Section Faces'];
 const shellNames=new Set(['Cast Iron Cylinder Block','Crossflow Cylinder Head','Upper Cylinder Barrel Casting','Deep Skirt Crankcase Casting','Machined Deck Face','Main Bearing Split Line','Lower Bedplate Rail','Cylinder Head Lower Casting','Upper Cam Carrier Casting','Machined Head Deck','Cam Carrier Rail']);
 const hardOff=new Set(['Cast Iron Cylinder Block','Crossflow Cylinder Head']);const originalVisible=new Map(),neutralized=new Set(),disabled=new Set();const hsl={h:0,s:0,l:0};
 function mats(o){return Array.isArray(o.material)?o.material:[o.material]}
 function red(c){if(!c?.getHSL)return false;c.getHSL(hsl);return hsl.s>.16&&(hsl.h<.075||hsl.h>.925)&&hsl.l>.035}
 function isOverlay(o){const n=((o.name||'')+' '+(o.parent?.name||'')).toLowerCase();return /section|cut face|cut edge|cut lip|section face|section edge|section reference|machined section/.test(n)}
 function neutral(m){if(!m)return;let changed=false;if(m.color&&red(m.color)){m.color.setHex((Number.isFinite(m.metalness)&&m.metalness>.75)?0xaeb8bd:0x4b5357);changed=true}if(m.emissive&&red(m.emissive)){m.emissive.setHex(0x000000);changed=true}if('vertexColors'in m&&m.vertexColors){m.vertexColors=false;changed=true}if(changed)m.needsUpdate=true;neutralized.add(m)}

 function scrub(){scanFrames++;const cut=cutOn();for(const n of groups){const g=scene.getObjectByName(n);if(g){g.visible=false;disabled.add(g)}}scene.traverse(o=>{if(!o)return;const name=o.name||'';if(shellNames.has(name)){if(!originalVisible.has(o))originalVisible.set(o,o.visible);for(const m of mats(o))neutral(m);o.visible=hardOff.has(name)?false:(cut?false:originalVisible.get(o))}if(isOverlay(o)){o.visible=false;disabled.add(o);return}for(const m of mats(o))neutral(m);if(!o.visible)return;const hasRed=mats(o).some(m=>red(m?.color)||red(m?.emissive));if((o.isLine||o.isLineSegments||o.isPoints||o.isSprite)&&hasRed){o.visible=false;disabled.add(o);return}if((o.isMesh||o.isInstancedMesh)&&hasRed){for(const m of mats(o))neutral(m)}});for(const m of neutralized){neutral(m)}return audit()}
 function audit(){let overlay=0,redObj=0,redMat=0;scene.traverse(o=>{if(!o?.visible)return;if(isOverlay(o))overlay++;for(const m of mats(o)){if(red(m?.color)||red(m?.emissive)){redMat++;redObj++;break}}});const clean=overlay===0&&redObj===0&&redMat===0;w.__v59Debug={clean,overlay,redObj,redMat,cleanFrames,scanFrames,disabled:disabled.size,neutralized:neutralized.size,cutaway:cutOn(),policy:'No red/pink geometry or material is permitted anywhere in the visible scene.'};return clean}
 function hideLegacy(){['v28Mode','v49qa','v50ref','v51ref','v52ref','v53ref','v54fix','v55fix','v56fix','v57clean','v58tag','v51qa','v52qa','v53qa','v54qa','v55qa','v56qa','v57qa'].forEach(id=>{const e=d.getElementById(id);if(e)e.style.display='none'})}
