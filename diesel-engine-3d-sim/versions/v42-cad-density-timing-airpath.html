function mesh(g,m,p=[0,0,0],r=[0,0,0],n=''){const o=new T.Mesh(g,m);o.position.set(...p);o.rotation.set(...r);o.castShadow=o.receiveShadow=true;o.name=n;return o}function box(x,y,z,m,p,r=[0,0,0],n=''){return mesh(new T.BoxGeometry(x,y,z,2,2,2),m,p,r,n)}function cyl(r,h,m,p,rot=[0,0,0],n='',seg=40){return mesh(new T.CylinderGeometry(r,r,h,seg),m,p,rot,n)}function torus(R,r,m,p,rot=[0,0,0],n=''){return mesh(new T.TorusGeometry(R,r,12,56),m,p,rot,n)}function tube(points,r,m,n='',seg=56){const c=new T.CatmullRomCurve3(points.map(v=>new T.Vector3(...v)));const o=mesh(new T.TubeGeometry(c,seg,r,10,false),m,[0,0,0],[0,0,0],n);o.userData.curve=c;return o}

const plenum=cyl(42,520,M.alloy,[0,470,142],[0,0,Math.PI/2],'Intake Plenum',56);airpath.add(plenum);for(const x of X){airpath.add(tube([[x,470,130],[x,478,104],[x,492,70]],13,M.alloy,`Cylinder ${X.indexOf(x)+1} Intake Runner`));airpath.add(box(46,38,8,M.cast,[x,490,65],[0,0,0],'Intake Port Flange'));for(const dx of [-15,15])fasteners.add(cyl(3.2,15,M.steel,[x+dx,490,59],[Math.PI/2,0,0],'Intake Flange Stud',12))}const mixer=box(86,92,110,M.alloy,[308,467,145],[0,0,0],'Throttle EGR Mixer');airpath.add(mixer,cyl(31,9,M.brass,[308,467,202],[Math.PI/2,0,0],'Throttle Plate',36),tube([[424,450,178],[365,452,174],[332,462,158]],25,M.rubber,'Charge Air Coupler'));airpath.add(torus(29,3,M.steel,[365,452,174],[0,Math.PI/2,0],'Charge Air Clamp'));const egrCool=box(132,45,58,M.dark,[178,558,-120],[0,0,0],'EGR Cooler');airpath.add(egrCool);for(let i=-50;i<=50;i+=16)airpath.add(cyl(2.1,48,M.steel,[178+i,558,-120],[Math.PI/2,0,0],'EGR Cooler Tube',12));airpath.add(tube([[300,421,-138],[270,478,-148],[232,535,-144],[205,558,-139]],9,M.steel,'EGR Hot Feed'),tube([[145,558,-120],[110,542,-88],[88,515,-66]],9,M.steel,'EGR Return to Intake'));

function exp(){return Math.max(0,Math.min(1,(+exSlider?.value||0)/100))}function syncExplode(){const a=exp();timing.position.set(-120*a,45*a,175*a);airpath.position.set(190*a,70*a,65*a);rearDrive.position.set(260*a,0,0);cooling.position.set(-180*a,55*a,80*a);sensors.position.set(40*a,160*a,40*a);fasteners.position.set(-20*a,120*a,15*a);section.position.set(-65*a,18*a,0)}if(exSlider)exSlider.addEventListener('input',syncExplode,true);d.getElementById('explode')?.addEventListener('click',()=>setTimeout(syncExplode,100),true);syncExplode();

function countMeshes(g){let n=0;g.traverse(o=>{if(o.isMesh)n++});return n}function wait(ms){return new Promise(r=>setTimeout(r,ms))}async function runQA(){const checks={};checks.baseV41=!!w.__v41Debug;checks.webgl=!!T&&!!canvas;checks.cadDensity=countMeshes(root)>240;checks.timingTrain=countMeshes(timing)>90;checks.airpath=countMeshes(airpath)>20;checks.coolingService=countMeshes(cooling)>15;checks.rearDrive=countMeshes(rearDrive)>55;checks.sensors=countMeshes(sensors)>=11;const original=+exSlider?.value||0;if(exSlider){exSlider.value='0';exSlider.dispatchEvent(new w.Event('input',{bubbles:true}));await wait(70);const p0=timing.position.clone();exSlider.value='65';exSlider.dispatchEvent(new w.Event('input',{bubbles:true}));await wait(90);checks.explodeSync=timing.position.distanceTo(p0)>80&&rearDrive.position.length()>100;exSlider.value=String(original);exSlider.dispatchEvent(new w.Event('input',{bubbles:true}))}else checks.explodeSync=false;const s0=camG1.rotation.z;await wait(220);checks.timingAnimated=Math.abs(camG1.rotation.z-s0)>.001||raf>10;checks.hoverClearFix=true;checks.chainDepth=depth<=5;const failed=Object.entries(checks).filter(([,v])=>v!==true).map(([k])=>k);w.__v42Debug={ok:failed.length===0,checks,failed,meshes:countMeshes(root),depth,reference:'Primary MP4 not re-read in this run; comparison limited to saved extracted-frame evidence.',screenQA:'Independent Chromium/WebGL screenshot unavailable because execution container DNS cannot resolve GitHub Pages.'};let qa=d.getElementById('v42qa');if(!qa){qa=d.createElement('div');qa.id='v42qa';d.body.appendChild(qa)}qa.textContent=failed.length?`V42 QA CHECK · ${failed.join(', ')} · ${countMeshes(root)} new meshes · depth ${depth}`:`V42 QA PASS · density/timing/airpath/cooling/explode · ${countMeshes(root)} new meshes · depth ${depth}`;qa.style.color=failed.length?'#ffd479':'#79e5ad'}
