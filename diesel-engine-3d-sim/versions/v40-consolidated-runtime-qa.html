const outer=document.getElementById('stage');let tries=0,done=false;outer.addEventListener('load',()=>setTimeout(applyV40,3300));setTimeout(()=>{if(!done)applyV40()},7800);
function deepest(){let f=outer,w=f.contentWindow,d=f.contentDocument,depth=1;for(let i=0;i<6;i++){const n=d&&d.getElementById('stage');if(!n)break;f=n;w=f.contentWindow;d=f.contentDocument;depth++}return{w,d,depth}}

const style=d.createElement('style');style.textContent=`#v35mode,#v35qa{display:none!important}#v40mode{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:10;padding:5px 11px;border:1px solid rgba(72,197,255,.62);border-radius:999px;background:rgba(2,9,15,.82);color:#d2f3ff;font:10px system-ui;pointer-events:none}#v40qa{position:absolute;right:12px;bottom:8px;z-index:150;padding:7px 10px;border-radius:8px;background:rgba(3,11,17,.96);border:1px solid rgba(91,210,255,.5);font:9px system-ui;pointer-events:none;max-width:430px;line-height:1.45}`;d.head.appendChild(style);const badge=d.querySelector('.qualityBadge');if(badge)badge.textContent='V40 · CONSOLIDATED QA · CUTAWAY';const dep=d.getElementById('deployBadge');if(dep)dep.textContent='GitHub stable · v40 · CONSOLIDATED RUNTIME QA';
const flowRoot=new T.Group();flowRoot.name='V40 Corrected Flow Visualization';scene.add(flowRoot);const coolant=new T.Group(),oil=new T.Group(),fuel=new T.Group();coolant.name='V40 Coolant Flow';oil.name='V40 Oil Flow';fuel.name='V40 Fuel Flow';flowRoot.add(coolant,oil,fuel);const mk=c=>new T.MeshBasicMaterial({color:c,transparent:true,opacity:.86,depthWrite:false,blending:T.AdditiveBlending}),MC=mk(0x28a8ff),MO=mk(0xffc23d),MF=mk(0xff7155);function dot(m,r=4){return new T.Mesh(new T.SphereGeometry(r,10,8),m)}function curve(points){return new T.CatmullRomCurve3(points.map(v=>new T.Vector3(...v)))}function stream(group,points,m,count,r,name){const c=curve(points),arr=[];for(let i=0;i<count;i++){const o=dot(m,r);o.name=name;o.userData.t=i/count;group.add(o);arr.push(o)}return{c,arr}}
const coolantStreams=[stream(coolant,[[-300,145,-105],[-300,360,-105],[-210,505,-108],[0,520,-110],[230,500,-108],[320,340,-100],[300,160,-95]],MC,30,4,'Coolant Particle'),stream(coolant,[[-250,185,-85],[-120,405,-95],[60,500,-105],[250,455,-102]],MC,22,3.6,'Head Coolant Particle')];const oilStreams=[stream(oil,[[302,185,148],[210,155,130],[70,120,120],[-130,105,85],[-250,110,20]],MO,24,3.3,'Oil Gallery Particle'),stream(oil,[[180,215,18],[242,315,-40],[300,410,-62],[340,455,-98]],MO,18,3.2,'Turbo Oil Particle')];const X=[-180,-60,60,180],fuelStreams=X.map(x=>stream(fuel,[[x,668,88],[x+10,630,65],[x+8,590,30],[x,520,0]],MF,12,3,'High Pressure Fuel Particle'));
function selectedSystem(){const a=d.querySelector('.systems .sys.active[data-system]');return a?a.dataset.system:'all'}function enabled(name){const cb=d.querySelector(`#systemChecks input[data-vis="${name}"]`);return !cb||cb.checked!==false}function sysVis(name){const s=selectedSystem();return enabled(name)&&(s==='all'||s===name)}function explodeAlpha(){const e=exSlider?Math.max(0,Math.min(1,(+exSlider.value||0)/100)):0;return 1-T.MathUtils.smoothstep(e,.08,.32)}function syncFlow(){const a=explodeAlpha(),e=exSlider?Math.max(0,Math.min(1,(+exSlider.value||0)/100)):0;coolant.visible=sysVis('cooling')&&e<=.38;oil.visible=sysVis('oil')&&e<=.38;fuel.visible=sysVis('fuel')&&e<=.38;for(const g of [coolant,oil,fuel])g.traverse(o=>{if(o.isMesh&&o.material)o.material.opacity=.86*a})}if(exSlider)exSlider.addEventListener('input',syncFlow,true);if(exBtn)exBtn.addEventListener('click',()=>setTimeout(syncFlow,90),true);
let last=performance.now(),frames=0;function animate(now){frames++;const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;syncFlow();for(const pack of [...coolantStreams,...oilStreams,...fuelStreams])for(const o of pack.arr){o.userData.t=(o.userData.t+dt*.13)%1;o.position.copy(pack.c.getPointAt(o.userData.t))}requestAnimationFrame(animate)}requestAnimationFrame(animate);
const mode=d.createElement('div');mode.id='v40mode';mode.textContent='V40 · 合并 V37/V39 运行修复：状态安全 / 拖拽 / 相位 / P–V / Hover / 爆炸流动';d.getElementById('app').appendChild(mode);function click(el){if(el)el.dispatchEvent(new w.MouseEvent('click',{bubbles:true,cancelable:true,view:w}))}function input(el,val){if(!el)return;el.value=String(val);el.dispatchEvent(new w.Event('input',{bubbles:true}))}function wait(ms){return new Promise(r=>setTimeout(r,ms))}function variance(cv){try{const c=cv.getContext('2d'),im=c.getImageData(0,0,Math.min(cv.width,180),Math.min(cv.height,120)).data;let min=765,max=0,n=0;for(let i=0;i<im.length;i+=16){const v=im[i]+im[i+1]+im[i+2];min=Math.min(min,v);max=Math.max(max,v);n++}return n>20&&(max-min)>45}catch(e){return false}}
async function phaseProbe(deg){input(scrub,deg);await wait(150);return{phase:d.getElementById('phase')?.textContent||'',inlet:d.getElementById('intakeState')?.textContent||'',exhaust:d.getElementById('exhaustState')?.textContent||''}}
async function dragProbe(){if(!canvas||!camera)return false;const r=canvas.getBoundingClientRect(),before=camera.position.clone(),x=r.left+r.width*.56,y=r.top+r.height*.48,PE=w.PointerEvent||w.MouseEvent;try{canvas.dispatchEvent(new PE('pointerdown',{clientX:x,clientY:y,bubbles:true,button:0,buttons:1,pointerId:41,pointerType:'mouse'}));canvas.dispatchEvent(new PE('pointermove',{clientX:x+70,clientY:y+28,bubbles:true,button:0,buttons:1,pointerId:41,pointerType:'mouse'}));canvas.dispatchEvent(new PE('pointerup',{clientX:x+70,clientY:y+28,bubbles:true,button:0,buttons:0,pointerId:41,pointerType:'mouse'}));await wait(160);return camera.position.distanceTo(before)>2}catch(e){return false}}
async function hoverProbe(){if(!canvas||!camera)return false;let target=null;for(const n of ['Full Flow Oil Filter','Oil Filter','Crankshaft Main Journal Set','Camshaft']){target=scene.getObjectByName(n);if(target)break}if(!target)return false;const wp=new T.Vector3();target.getWorldPosition(wp);const q=wp.clone().project(camera),r=canvas.getBoundingClientRect();if(Math.abs(q.x)>1.05||Math.abs(q.y)>1.05)return false;const x=r.left+(q.x*.5+.5)*r.width,y=r.top+(-q.y*.5+.5)*r.height,PE=w.PointerEvent||w.MouseEvent;canvas.dispatchEvent(new PE('pointermove',{clientX:x,clientY:y,bubbles:true,pointerType:'mouse'}));await wait(130);const ok=d.getElementById('tooltip')?.style.display==='block';canvas.dispatchEvent(new PE('pointerleave',{clientX:x,clientY:y,bubbles:true,pointerType:'mouse'}));return ok}
async function runQA(){const result={},pv=d.getElementById('pvSide'),initial={angle:+scrub?.value||248,wasPlaying:(play?.textContent||'').includes('暂停'),explode:+exSlider?.value||0};let meshes=0;scene.traverse(o=>{if(o.isMesh)meshes++});result.baseV35=!!w.__v35Debug?.ok;result.meshDensity=meshes>450;result.pvRendered=!!pv&&variance(pv);result.webgl=!!canvas&&!!T;result.controls=!!d.getElementById('explode')&&!!d.getElementById('cutaway')&&!!play;result.flowCounts=coolant.children.length>=50&&oil.children.length>=40&&fuel.children.length>=48;result.chainDepth=depth<=5;const p90=await phaseProbe(90),p270=await phaseProbe(270),p450=await phaseProbe(450),p630=await phaseProbe(630);result.phaseCycle=/吸气/.test(p90.phase)&&/压缩/.test(p270.phase)&&/做功/.test(p450.phase)&&/排气/.test(p630.phase);result.valveCycle=/开启/.test(p90.inlet)&&/开启/.test(p630.exhaust);if(exSlider){input(exSlider,0);await wait(80);const a0=explodeAlpha();input(exSlider,55);await wait(100);const a1=explodeAlpha();result.explodedFlowSync=a0>.9&&a1<.15;input(exSlider,initial.explode)}else result.explodedFlowSync=false;const side=d.querySelector('[data-view="side"]'),front=d.querySelector('[data-view="front"]');if(camera&&side&&front){const p0=camera.position.clone();click(side);await wait(90);const ps=camera.position.clone();click(front);await wait(90);const pf=camera.position.clone();result.multiView=ps.distanceTo(p0)>50&&pf.distanceTo(ps)>50;result.dragOrbit=await dragProbe();click(front)}else{result.multiView=false;result.dragOrbit=false}result.hoverCard=await hoverProbe();result.performanceFrames=frames>20;input(scrub,initial.angle);if(initial.wasPlaying&&play&&!((play.textContent||'').includes('暂停')))click(play);if(!initial.wasPlaying&&play&&(play.textContent||'').includes('暂停'))click(play);if(exSlider)input(exSlider,initial.explode);syncFlow();await wait(100);result.stateRestored=Math.abs((+scrub?.value||0)-initial.angle)<1&&(((play?.textContent||'').includes('暂停'))===initial.wasPlaying);const failed=Object.entries(result).filter(([k,v])=>v!==true).map(([k])=>k);w.__v40Debug={ok:failed.length===0,checks:result,failed,sceneMeshes:meshes,iframeDepth:depth,frames,phaseSamples:{p90,p270,p450,p630},screenQA:'automated runtime regression only; no independent screenshot comparison',referenceQA:'primary MP4 not re-read in this run'};let qa=d.getElementById('v40qa');if(!qa){qa=d.createElement('div');qa.id='v40qa';d.body.appendChild(qa)}qa.textContent=failed.length?`V40 QA CHECK · ${failed.join(', ')} · ${meshes} meshes · depth ${depth}`:`V40 QA PASS · state/drag/phase/P–V/views/Hover/flow · ${meshes} meshes · depth ${depth}`;qa.style.color=failed.length?'#ffd479':'#79e5ad'}
const front=d.querySelector('[data-view="front"]');if(front)front.click();const cut=d.getElementById('cutaway');if(cut&&!cut.classList.contains('active'))cut.click();syncFlow();setTimeout(runQA,1800);document.getElementById('boot')?.remove()}
