const stage=document.getElementById('stage'),boot=document.getElementById('boot');let installed=false,revealed=false,tries=0,timer=0;const started=performance.now();
function chain(){const a=[];let f=stage;for(let i=0;i<18;i++){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d)break;a.push({f,w,d});const n=d.getElementById('stage');if(!n||!n.contentWindow)break;f=n}catch(e){break}}return a}
function runtime(){const a=chain();for(let i=a.length-1;i>=0;i--){const q=a[i],p=q.w&&q.w.__v25PatchDebug;if(q.w&&q.w.THREE&&p?.refRoot&&q.d.getElementById('canvas3d'))return q}return null}
function hideBoots(){for(const {d} of chain()){const b=d.getElementById('boot');if(b){b.style.display='none';b.style.pointerEvents='none'}}}
function reveal(reason){if(revealed)return;hideBoots();revealed=true;boot?.remove();window.__v57Launch={ready:true,reason,depth:chain().length,loadMs:Math.round(performance.now()-started)}}
function apply(){const q=runtime();if(!q)return false;const {w,d}=q,T=w.THREE,p=w.__v25PatchDebug,scene=p.refRoot.parent;if(!scene)return false;
 const overlayGroups=['V28 Machined Section Faces','V50 Section Faces','V51 Block Section Faces','V52 Head Section Faces','V53 Cranktrain Section Faces'];
 const shellNames=new Set(['Cast Iron Cylinder Block','Crossflow Cylinder Head','Upper Cylinder Barrel Casting','Deep Skirt Crankcase Casting','Machined Deck Face','Main Bearing Split Line','Lower Bedplate Rail','Cylinder Head Lower Casting','Upper Cam Carrier Casting','Machined Head Deck','Cam Carrier Rail']);
 const hardOff=new Set(['Cast Iron Cylinder Block','Crossflow Cylinder Head']);
 const trackedShells=new Map(),disabled=new Set();
 function mats(o){return Array.isArray(o.material)?o.material:[o.material]}
 function reddish(m){if(!m?.color)return false;const c=m.color;return c.r>.30&&c.r>c.g*1.13&&c.r>c.b*1.08}
 function dims(o){try{const g=o.geometry;if(!g)return null;if(!g.boundingBox)g.computeBoundingBox();if(!g.boundingBox)return null;const v=new T.Vector3();g.boundingBox.getSize(v);return [Math.abs(v.x),Math.abs(v.y),Math.abs(v.z)].sort((a,b)=>b-a)}catch(e){return null}}
 function cutOn(){return d.getElementById('cutaway')?.classList.contains('active')===true}
 function overlayLike(o){const n=((o.name||'')+' '+(o.parent?.name||'')).toLowerCase();return /section face|section edge|section reference|cut edge|cut lip|cut face|machined section|section faces/.test(n)}
 function neutralizeShell(o){for(const m of mats(o)){if(!m?.color)continue;m.color.setHex(0x4b5357);if('roughness'in m)m.roughness=Math.max(.48,Number.isFinite(m.roughness)?m.roughness:.48);if('metalness'in m)m.metalness=Math.min(.70,Number.isFinite(m.metalness)?m.metalness:.6);if('transparent'in m){m.transparent=false;m.opacity=1;m.depthWrite=true;m.depthTest=true}}}
 function init(){for(const gname of overlayGroups){const g=scene.getObjectByName(gname);if(g){g.visible=false;disabled.add(gname)}}scene.traverse(o=>{const n=o.name||'';if(shellNames.has(n)){if(!trackedShells.has(o))trackedShells.set(o,o.visible);neutralizeShell(o);if(hardOff.has(n))o.visible=false}})}
 function scrub(){init();const cut=cutOn();let redLines=0,redOverlayMeshes=0,largeWarm=0;for(const [o,initial] of trackedShells){if(hardOff.has(o.name)){o.visible=false;continue}o.visible=cut?false:initial;neutralizeShell(o)}
  for(const gname of overlayGroups){const g=scene.getObjectByName(gname);if(g)g.visible=false}
  scene.traverse(o=>{if(!o.visible)return;const mm=mats(o),red=mm.some(reddish),ds=dims(o);if((o.isLine||o.isLineSegments)&&red){o.visible=false;o.userData.v57NoRedOutline=true;disabled.add(o.name||o.uuid);redLines++;return}if((o.isMesh||o.isInstancedMesh)&&red&&overlayLike(o)){o.visible=false;o.userData.v57NoRedOverlay=true;disabled.add(o.name||o.uuid);redOverlayMeshes++;return}if(cut&&(o.isMesh||o.isInstancedMesh)&&red&&mm.some(m=>m?.transparent&&Number.isFinite(m.opacity)&&m.opacity<.9)&&ds&&ds[0]>160&&ds[1]>70){o.visible=false;o.userData.v57NoPinkWall=true;disabled.add(o.name||o.uuid);largeWarm++}}
  );
  w.__v57Debug=w.__v57Debug||{};Object.assign(w.__v57Debug,{cutaway:cut,disabledTotal:disabled.size,redLines,redOverlayMeshes,largeWarm,trackedShells:trackedShells.size,lastScrubMs:Math.round(performance.now()-started)});return true}
 scrub();
 if(!installed){installed=true;['v28Mode','v50ref','v51ref','v52ref','v53ref','v54fix','v55fix','v56fix','v51qa','v52qa','v53qa','v54qa','v55qa','v56qa'].forEach(id=>{const e=d.getElementById(id);if(e)e.style.display='none'});const cut=d.getElementById('cutaway'),reset=d.getElementById('reset'),exp=d.getElementById('explodeAmount'),explode=d.getElementById('explode');cut?.addEventListener('click',()=>setTimeout(scrub,70),true);reset?.addEventListener('click',()=>setTimeout(scrub,120),true);exp?.addEventListener('input',()=>setTimeout(scrub,0),true);explode?.addEventListener('click',()=>setTimeout(scrub,80),true);d.querySelectorAll('.systems .sys,#systemChecks input').forEach(el=>el.addEventListener('click',()=>setTimeout(scrub,60),true));let passes=0;const guard=w.setInterval(()=>{scrub();passes++;if(passes>180)w.clearInterval(guard)},300);
  const css=d.createElement('style');css.textContent='#v57clean{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:390;padding:5px 9px;border-radius:999px;background:rgba(2,10,16,.92);border:1px solid rgba(121,229,173,.60);color:#dff8e9;font:9px system-ui;pointer-events:none;white-space:nowrap}@media(max-width:900px),(pointer:coarse){#v57clean{top:48px;font-size:8px;max-width:88vw;overflow:hidden;text-overflow:ellipsis}}';d.head.appendChild(css);const badge=d.createElement('div');badge.id='v57clean';badge.textContent='V57 · CLEAN CUTAWAY · NO PINK WALLS / NO RED SECTION OUTLINES';d.body.appendChild(badge);
  w.setTimeout(()=>{scrub();let visibleGroups=0,redLineVisible=0,redOverlayVisible=0,largePinkVisible=0;for(const gname of overlayGroups){const g=scene.getObjectByName(gname);if(g?.visible)visibleGroups++}scene.traverse(o=>{if(!o.visible)return;const mm=mats(o),red=mm.some(reddish),ds=dims(o);if((o.isLine||o.isLineSegments)&&red)redLineVisible++;if((o.isMesh||o.isInstancedMesh)&&red&&overlayLike(o))redOverlayVisible++;if(cutOn()&&(o.isMesh||o.isInstancedMesh)&&red&&mm.some(m=>m?.transparent&&m.opacity<.9)&&ds&&ds[0]>160&&ds[1]>70)largePinkVisible++});const ok=visibleGroups===0&&redLineVisible===0&&redOverlayVisible===0&&largePinkVisible===0;Object.assign(w.__v57Debug,{ok,visibleOverlayGroups:visibleGroups,visibleRedLines:redLineVisible,visibleRedOverlayMeshes:redOverlayVisible,visibleLargePinkWalls:largePinkVisible,policy:'No red/pink section highlight geometry. Cutaway reveals internals by hiding outer shells only.'});let el=d.getElementById('v57qa');if(!el){el=d.createElement('div');el.id='v57qa';el.style.cssText='position:absolute;right:8px;bottom:8px;z-index:391;padding:6px 8px;border-radius:8px;background:rgba(3,11,17,.92);border:1px solid rgba(91,210,255,.42);font:9px system-ui;pointer-events:none';d.body.appendChild(el)}el.textContent=ok?'V57 QA PASS · pink walls 0 · red section outlines 0':`V57 QA CHECK · groups ${visibleGroups} · lines ${redLineVisible} · overlays ${redOverlayVisible} · walls ${largePinkVisible}`;el.style.color=ok?'#79e5ad':'#ffd479'},1500)
 }
 if(!revealed)reveal('clean-cutaway-applied-before-reveal');return true}
function poll(){clearTimeout(timer);tries++;if(apply())return;if(tries>160){if(boot)boot.textContent='V57 初始化失败：三维运行时未建立';window.__v57Launch={ready:false,failed:'runtime unavailable',depth:chain().length};return}if(boot)boot.textContent=`正在进入 V57 · 纯净剖视… ${Math.max(1,Math.round((performance.now()-started)/1000))}s`;timer=setTimeout(poll,160)}stage.addEventListener('load',()=>setTimeout(poll,40));setTimeout(poll,80);
</script></body></html>
