<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>直列四缸柴油机 · V43 System-integrated CAD + Performance</title><style>html,body,#stage{margin:0;width:100%;height:100%;border:0;background:#02070c;overflow:hidden}#boot{position:fixed;inset:0;display:grid;place-items:center;z-index:100;background:#02070c;color:#dff4ff;font:14px system-ui;text-align:center;padding:24px}</style></head><body><div id="boot">正在进入 V43 · 系统级 CAD 显隐 / 重复件实例化 / 交互回归…</div><iframe id="stage" src="v42-cad-density-timing-airpath.html?v43base=2" title="V43 柴油机 3D 仿真"></iframe><script>
const outer=document.getElementById('stage');let tries=0,done=false;outer.addEventListener('load',()=>setTimeout(applyV43,4200));setTimeout(()=>{if(!done)applyV43()},9000);
function deepest(){let f=outer,w=f.contentWindow,d=f.contentDocument,depth=1;for(let i=0;i<10;i++){const n=d&&d.getElementById('stage');if(!n)break;f=n;w=f.contentWindow;d=f.contentDocument;depth++}return{w,d,depth}}
function applyV43(){if(done)return;tries++;const {w,d,depth}=deepest(),T=w&&w.THREE;if(!T||!w.__v42Debug){if(tries<40)return setTimeout(applyV43,900);document.getElementById('boot').textContent='V43 初始化失败：V42/WebGL 运行时未就绪';return}const scene=[...d.querySelectorAll('canvas')].length&&w.__v25PatchDebug?.refRoot?.parent;if(!scene){if(tries<40)return setTimeout(applyV43,900);document.getElementById('boot').textContent='V43 初始化失败：未找到 Three.js 场景';return}done=true;
const root=scene.getObjectByName('V42 CAD Density Mechanical Layer');if(!root){document.getElementById('boot').textContent='V43 初始化失败：V42 CAD 层缺失';return}const timing=root.children[0],airpath=root.children[1],rearDrive=root.children[2],cooling=root.children[3],sensors=root.children[4],fasteners=root.children[5],section=root.children[6];
const style=d.createElement('style');style.textContent=`#v42mode,#v42qa{display:none!important}#v43mode{position:absolute;top:55px;left:50%;transform:translateX(-50%);z-index:16;padding:5px 11px;border:1px solid rgba(83,210,255,.70);border-radius:999px;background:rgba(2,9,15,.88);color:#e3f8ff;font:10px system-ui;pointer-events:none}#v43qa{position:absolute;right:12px;bottom:8px;z-index:180;padding:7px 10px;border-radius:8px;background:rgba(3,11,17,.96);border:1px solid rgba(91,210,255,.52);font:9px system-ui;pointer-events:none;max-width:560px;line-height:1.45}`;d.head.appendChild(style);const badge=d.querySelector('.qualityBadge');if(badge)badge.textContent='V43 · SYSTEM-INTEGRATED CAD · INSTANCED';const dep=d.getElementById('deployBadge');if(dep)dep.textContent='GitHub stable · v43 · SYSTEM VISIBILITY + INSTANCING';
// V42 creates one geometry object per repeated tooth/fastener. Group by semantic part name + material, then reuse the first identical geometry in an InstancedMesh.
let hiddenRepeated=0,instancers=0,instances=0;function instanceDirect(parent,accept){if(!parent)return;const buckets=new Map();for(const o of [...parent.children]){if(!o.isMesh||!accept(o))continue;const key=[o.name,o.material?.uuid].join('|');if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(o)}for(const arr of buckets.values()){if(arr.length<3)continue;const first=arr[0],im=new T.InstancedMesh(first.geometry,first.material,arr.length);im.name='V43 Instanced '+first.name;im.castShadow=im.receiveShadow=true;arr.forEach((o,i)=>{o.updateMatrix();im.setMatrixAt(i,o.matrix);o.visible=false;hiddenRepeated++;instances++});im.instanceMatrix.needsUpdate=true;parent.add(im);instancers++}}
if(timing)for(const g of timing.children.filter(o=>o.isGroup))instanceDirect(g,o=>/Tooth/.test(o.name));instanceDirect(rearDrive,o=>/Ring Gear Tooth/.test(o.name));instanceDirect(fasteners,o=>/(Bolt|Stud)/.test(o.name));
function selected(){return d.querySelector('.systems .sys.active')?.dataset.system||'all'}function checked(sys){const cb=d.querySelector(`#systemChecks input[data-vis="${sys}"]`);return !cb||cb.checked}function focusAllows(names){const s=selected();return s==='all'||names.includes(s)}function syncSystems(){if(timing)timing.visible=focusAllows(['motion','valve','fuel'])&&(checked('motion')||checked('valve')||checked('fuel'));if(airpath)airpath.visible=focusAllows(['gas'])&&checked('gas');if(rearDrive)rearDrive.visible=focusAllows(['motion'])&&checked('motion');if(cooling)cooling.visible=focusAllows(['cooling'])&&checked('cooling');if(sensors)sensors.visible=selected()==='all'||focusAllows(['motion','fuel','oil','cooling','gas']);if(fasteners)fasteners.visible=selected()==='all'||focusAllows(['motion','valve','fuel','gas','cooling']);if(section)section.visible=(d.getElementById('cutaway')?.classList.contains('active')!==false)&&focusAllows(['motion'])}
d.querySelectorAll('.systems .sys,#systemChecks input').forEach(el=>el.addEventListener('click',()=>setTimeout(syncSystems,0),true));d.getElementById('cutaway')?.addEventListener('click',()=>setTimeout(syncSystems,60),true);syncSystems();d.getElementById('reset')?.addEventListener('click',()=>setTimeout(syncSystems,120),true);d.getElementById('tour')?.addEventListener('click',()=>setTimeout(syncSystems,120),true);
const mode=d.createElement('div');mode.id='v43mode';mode.textContent='V43 · CAD 总成已接入系统聚焦；重复齿/螺栓实例化以降低 Draw Calls';d.getElementById('app')?.appendChild(mode);
function wait(ms){return new Promise(r=>setTimeout(r,ms))}async function runQA(){const checks={};checks.baseV42=!!w.__v42Debug;checks.v42Healthy=w.__v42Debug?.ok===true;checks.instancing=instancers>=3&&instances>=40;checks.visualDensity=root.children.length>=7;const all=d.querySelector('.systems .sys[data-system="all"]'),gas=d.querySelector('.systems .sys[data-system="gas"]'),cool=d.querySelector('.systems .sys[data-system="cooling"]'),motion=d.querySelector('.systems .sys[data-system="motion"]');if(gas&&cool&&motion&&all){gas.click();await wait(80);checks.gasIsolation=airpath?.visible===true&&rearDrive?.visible===false&&cooling?.visible===false;cool.click();await wait(80);checks.coolingIsolation=cooling?.visible===true&&airpath?.visible===false;motion.click();await wait(80);checks.motionIsolation=rearDrive?.visible===true&&airpath?.visible===false&&cooling?.visible===false;all.click();await wait(90);checks.allRestore=airpath?.visible===checked('gas')&&rearDrive?.visible===checked('motion')&&cooling?.visible===checked('cooling')}else checks.systemControls=false;const cut=d.getElementById('cutaway');if(cut){const was=cut.classList.contains('active');if(was)cut.click();await wait(80);checks.sectionHidesWhenClosed=section?.visible===false;if(was)cut.click();await wait(80);checks.cutawayRestore=cut.classList.contains('active')===was}else checks.sectionHidesWhenClosed=false;checks.chainDepth=depth<=6;const failed=Object.entries(checks).filter(([,v])=>v!==true).map(([k])=>k);w.__v43Debug={ok:failed.length===0,checks,failed,depth,instancers,instances,hiddenRepeated,reference:'Primary MP4 not re-read byte-for-byte in this run; benchmark evidence uses saved extracted-frame review.',screenQA:'No independent Chromium/WebGL screenshot evidence in this run.'};let qa=d.getElementById('v43qa');if(!qa){qa=d.createElement('div');qa.id='v43qa';d.body.appendChild(qa)}qa.textContent=failed.length?`V43 QA CHECK · ${failed.join(', ')} · ${instances} instances / ${instancers} draws · depth ${depth}`:`V43 QA PASS · system isolation / cutaway / instancing · ${instances} instances / ${instancers} draws · depth ${depth}`;qa.style.color=failed.length?'#ffd479':'#79e5ad'}setTimeout(runQA,1800);document.getElementById('boot')?.remove()}
</script></body></html>
